const TAGESZEITEN = [
  { key: 'morgens', label: 'Morgens', icon: '🌅' },

const HEUTE = new Date();
const HEUTE_STR = fmtDate(HEUTE);
const GESTERN = new Date(HEUTE); GESTERN.setDate(GESTERN.getDate()-1);
const GESTERN_STR = fmtDate(GESTERN);
const MONAT_STR = `${HEUTE.getFullYear()}-${String(HEUTE.getMonth()+1).padStart(2,'0')}`;
const WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONATE_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DATUM_ANZEIGE = `${WOCHENTAGE[HEUTE.getDay()]}, ${HEUTE.getDate()}. ${MONATE_DE[HEUTE.getMonth()]}`;
const MONAT_ANZEIGE = `${MONATE_DE[HEUTE.getMonth()]} ${HEUTE.getFullYear()}`;

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let checksHeute = {};
let checksGestern = {};
let zuweisung = {};
let pendingBereich = null;
let pendingTageszeit = null;
let pendingIndex = null;
let currentDetailBereich = null;
let currentTageszeit = 'morgens';

async function sbFetch(path, opts={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': opts.prefer||'return=representation', ...opts.headers },
    ...opts
  });
  const text = await res.text();
  if(!res.ok) throw new Error(text);
  return text ? JSON.parse(text) : [];
}

async function ladeAlles() {
  try {
    const zuw = await sbFetch(`salon_monatszuweisung?monat=eq.${MONAT_STR}&select=bereich,person`);
    zuweisung = {};
    zuw.forEach(z => { zuweisung[z.bereich] = z.person; });

    const ch = await sbFetch(`salon_checks?datum=eq.${HEUTE_STR}&select=bereich,aufgabe_index,person,uhrzeit`);
    checksHeute = {};
    ch.forEach(c => { const parts=c.aufgabe_index.split('|'); if(parts.length===2) checksHeute[`${c.bereich}-${parts[0]}-${parts[1]}`] = {person:c.person,uhrzeit:c.uhrzeit}; });

    const cg = await sbFetch(`salon_checks?datum=eq.${GESTERN_STR}&select=bereich,aufgabe_index,erledigt`);
    checksGestern = {};
    cg.forEach(c => { if(c.erledigt) { const parts=c.aufgabe_index.split('|'); if(parts.length===2) checksGestern[`${c.bereich}-${parts[0]}-${parts[1]}`] = true; } });

    renderMain();
  } catch(e) {
    document.getElementById('main-content').innerHTML = `<div class="loading">⚠️ Verbindung fehlgeschlagen.<br><small>${e.message}</small></div>`;
  }
}

function getTotalUndDone(bereichKey) {
  const b = BEREICHE[bereichKey];
  let total = 0, done = 0;
  // Nur morgens, untertags, abends (nicht wöchentlich) für Tagesfortschritt
  const tzKeys = HEUTE.getDay() === 0 || HEUTE.getDay() === 6 ? ['morgens','untertags','abends','woechentlich'] : ['morgens','untertags','abends'];
  tzKeys.forEach(tz => {
    (b.aufgaben[tz]||[]).forEach((_,i) => {
      total++;
      if(checksHeute[`${bereichKey}-${tz}-${i}`]) done++;
    });
  });
  return {total, done};
}

function renderMain() {
  const badge = HEUTE.getHours() < 13 ? 'Morgencheck' : 'Abendcheck';
  let html = `
    <div class="date-banner">
      <div><div class="dt">${DATUM_ANZEIGE}</div><div class="dsub">Tagesübersicht</div></div>
      <div class="check-badge">${badge}</div>

    <div class="slabel">Verantwortungsbereiche</div>`;

  Object.entries(BEREICHE).forEach(([key,b]) => {
    const {total,done} = getTotalUndDone(key);
    const pct = total > 0 ? Math.round((done/total)*100) : 0;
    const fc = pct===100?'done':pct>0?'partial':'empty';
    const person = zuweisung[key]||'–';
    html += `
      <div class="area-card" onclick="openDetail('${key}')">
        <div class="card-top"><div class="area-name">${b.name}</div><div class="resp-pill">${person}</div></div>
        <div class="prog-row">
          <div class="prog-bg"><div class="prog-fill ${fc}" style="width:${pct}%"></div></div>
          <div class="prog-text">${done} von ${total}</div>
          <div class="arrow">›</div>
        </div>
      </div>`;
  });

  html += `<div class="slabel" style="margin-top:4px;">Hinweis</div>
    <div class="info-box">Morgencheck: erste anwesende Person.<br>Abendcheck: letzte Person vor Salonschluss.</div>`;
  document.getElementById('main-content').innerHTML = html;
}

function openDetail(key) {
  currentDetailBereich = key;
  currentTageszeit = HEUTE.getHours() < 13 ? 'morgens' : HEUTE.getHours() < 17 ? 'untertags' : 'abends';
  const b = BEREICHE[key];
  const person = zuweisung[key]||'–';
  document.getElementById('detail-title').textContent = b.name;
  document.getElementById('detail-resp').innerHTML = `Verantwortlich: <span>${person}</span>`;
  document.getElementById('detail-screen').classList.add('open');
  renderTzTabs();
  renderDetail();
}

function renderTzTabs() {
  const key = currentDetailBereich;
  const b = BEREICHE[key];
  let html = '';
  TAGESZEITEN.forEach(tz => {
    const aufgaben = b.aufgaben[tz.key]||[];
    const done = aufgaben.filter((_,i)=>checksHeute[`${key}-${tz.key}-${i}`]).length;
    const active = tz.key === currentTageszeit ? ' active' : '';
    html += `<button class="tz-tab${active}" onclick="switchTz('${tz.key}')">
      ${tz.icon} ${tz.label}<span class="tz-count">${done}/${aufgaben.length}</span>
    </button>`;
  });
  document.getElementById('tz-tabs').innerHTML = html;
}

function switchTz(tz) {
  currentTageszeit = tz;
  renderTzTabs();
  renderDetail();
}

function renderDetail() {
  const key = currentDetailBereich;
  const tz = currentTageszeit;
  const aufgaben = BEREICHE[key].aufgaben[tz]||[];

  const hatGestern = aufgaben.some((_,i)=>checksGestern[`${key}-${tz}-${i}`]);
  const vortagOffen = hatGestern ? aufgaben.filter((_,i)=>!checksGestern[`${key}-${tz}-${i}`]&&!checksHeute[`${key}-${tz}-${i}`]).length : 0;
  let banner = vortagOffen > 0 ? `<div class="vortag-banner">⚠ ${vortagOffen} Punkt${vortagOffen>1?'e':''} von gestern noch offen</div>` : '';

  if(aufgaben.length === 0) {
    document.getElementById('detail-content').innerHTML = `<div class="empty-state">Keine Aufgaben für diesen Zeitraum</div>`;
    return;
  }

  let items = '';
  aufgaben.forEach((aufgabe,i) => {
    const k = `${key}-${tz}-${i}`;
    const check = checksHeute[k];
    const done = !!check;
    const vortag = hatGestern && !checksGestern[k] && !done;
    items += `
      <div class="check-item${vortag?' vortag':''}" onclick="toggleItem('${key}','${tz}',${i})">
        <div class="cb${done?' checked':''}"></div>
        <div class="item-body">
          <div class="item-label${done?' done':''}">${vortag?'<span class="vortag-dot"></span>':''}${aufgabe}</div>
          ${done?`<div class="item-meta">${check.person} · ${check.uhrzeit}</div>`:''}
        </div>
      </div>`;
  });

  document.getElementById('detail-content').innerHTML = `${banner}<div class="checklist-card">${items}</div>`;
}

function closeDetail() {
  document.getElementById('detail-screen').classList.remove('open');
  currentDetailBereich = null;
  renderMain();
}

function toggleItem(bereich, tz, index) {
  const k = `${bereich}-${tz}-${index}`;
  if(checksHeute[k]) { uncheckeItem(bereich,tz,index); return; }
  pendingBereich = bereich;
  pendingTageszeit = tz;
  pendingIndex = index;
  document.getElementById('name-list').innerHTML = TEAM.map(n=>`<button class="name-btn" onclick="selectName('${n}')">${n}</button>`).join('');
  document.getElementById('modal').classList.add('open');
}

async function selectName(name) {
  document.getElementById('modal').classList.remove('open');
  const bereich = pendingBereich, tz = pendingTageszeit, index = pendingIndex;
  const k = `${bereich}-${tz}-${index}`;
  const now = new Date();
  const uhrzeit = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  checksHeute[k] = {person:name,uhrzeit};
  renderDetail(); renderTzTabs();
  try {
    await sbFetch('salon_checks',{method:'POST',prefer:'resolution=merge-duplicates',body:JSON.stringify({datum:HEUTE_STR,bereich,aufgabe_index:`${tz}|${index}`,person:name,uhrzeit,erledigt:true})});
    showToast(`✓ ${name}`);
  } catch(e) { delete checksHeute[k]; renderDetail(); showToast('⚠ Fehler'); }
}

async function uncheckeItem(bereich,tz,index) {
  const k = `${bereich}-${tz}-${index}`, prev = checksHeute[k];
  delete checksHeute[k]; renderDetail(); renderTzTabs();
  try { await sbFetch(`salon_checks?datum=eq.${HEUTE_STR}&bereich=eq.${bereich}&aufgabe_index=eq.${tz}|${index}`,{method:'DELETE',prefer:''}); }
  catch(e) { checksHeute[k]=prev; renderDetail(); }
}

function cancelModal() { document.getElementById('modal').classList.remove('open'); }

function showMonth() {
  setTab('monat');
  document.getElementById('month-screen').classList.add('open');
  let html = `<div class="month-header-card"><div class="month-label-sm">Aktuelle Zuweisung</div><div class="month-name">${MONAT_ANZEIGE}</div></div><div class="slabel">Verantwortliche Personen</div>`;
  Object.entries(BEREICHE).forEach(([key,b]) => {
    const person = zuweisung[key]||'–';
    html += `<div class="month-card"><div class="mc-area">${b.name}</div><div class="mc-person-row"><div class="mc-avatar">${person.charAt(0)}</div><div><div class="mc-name">${person}</div><div class="mc-role">Hauptverantwortlich ${MONATE_DE[HEUTE.getMonth()]}</div></div></div></div>`;
  });
  document.getElementById('month-content').innerHTML = html;
}
function closeMonth() { document.getElementById('month-screen').classList.remove('open'); setTab('heute'); }
function showMain() { setTab('heute'); document.getElementById('month-screen').classList.remove('open'); }

function toggleAdmin() {
  const s = document.getElementById('admin-screen');
  if(s.classList.contains('open')) { s.classList.remove('open'); return; }
  const pw = prompt('Admin-Passwort:');
  if(pw === 'walenta2026') { s.classList.add('open'); renderAdmin(); }
  else if(pw !== null) showToast('❌ Falsches Passwort');
}
function closeAdmin() { document.getElementById('admin-screen').classList.remove('open'); }

function renderAdmin() {
  let html = '';

  // Bereiche umbenennen
  html += `<div class="admin-section"><div class="admin-section-title">Bereiche umbenennen</div>`;
  Object.entries(BEREICHE).forEach(([key,b]) => {
    html += `<div class="admin-row">
      <input class="bereich-name-input" id="bname-${key}" value="${b.name}" type="text">
      <button class="btn-small green" onclick="bereichUmbenennen('${key}')">✓</button>
    </div>`;
  });
  html += '</div>';

  // Monatszuweisung
  html += `<div class="admin-section"><div class="admin-section-title">Monatszuweisung – ${MONAT_ANZEIGE}</div>`;
  Object.entries(BEREICHE).forEach(([key,b]) => {
    const curr = zuweisung[key]||'';
    html += `<div class="admin-row">
      <div><div class="admin-row-label">${b.name}</div><div class="admin-row-sub">Verantwortlich: ${curr||'–'}</div></div>
      <select class="admin-select" onchange="zuweisungAendern('${key}',this.value)">
        <option value="">–</option>
        ${TEAM.map(n=>`<option value="${n}"${curr===n?' selected':''}>${n}</option>`).join('')}
      </select></div>`;
  });
  html += '</div>';

  // Aufgaben pro Bereich und Tageszeit – mit Drag & Drop + Verschieben
  Object.entries(BEREICHE).forEach(([key,b]) => {
    TAGESZEITEN.forEach(tz => {
      const aufgaben = b.aufgaben[tz.key]||[];
      const othTz = TAGESZEITEN.filter(t=>t.key!==tz.key).map(t=>`<option value="${t.key}">${t.label}</option>`).join('');
      html += `<div class="admin-section"><div class="admin-section-title">${b.name} – ${tz.label}</div>
`;
      aufgaben.forEach((a,i) => {
        const isFirst = i===0, isLast = i===aufgaben.length-1;
        html += `<div class="admin-row">
          <div class="admin-row-label">${a}</div>
          <div class="admin-row-actions">
            <button class="btn-small arrow" onclick="aufgabeHoch('${key}','${tz.key}',${i})" ${isFirst?'disabled':''}>↑</button>
            <button class="btn-small arrow" onclick="aufgabeRunter('${key}','${tz.key}',${i})" ${isLast?'disabled':''}>↓</button>
            <select class="move-select" id="mv-${key}-${tz.key}-${i}">
              <option value="">→ wohin?</option>
              ${othTz}
            </select>
            <button class="btn-small blue" onclick="aufgabeVerschieben('${key}','${tz.key}',${i})">↗</button>
            <button class="btn-small red" onclick="aufgabeLoeschen('${key}','${tz.key}',${i})">✕</button>
          </div>
        </div>`;
      });
      html += `
        <div class="add-form">
          <input class="admin-input" id="neu-${key}-${tz.key}" placeholder="Neue Aufgabe…" type="text"
            onkeydown="if(event.key==='Enter')aufgabeHinzufuegen('${key}','${tz.key}')">
          <button class="add-btn" onclick="aufgabeHinzufuegen('${key}','${tz.key}')">+</button>
        </div></div>`;
    });
  });

  // Team
  html += '<div class="admin-section"><div class="admin-section-title">Team</div>';
  TEAM.forEach((name,i) => {
    html += `<div class="admin-row"><div class="admin-row-label">${name}</div>
      <button class="btn-small red" onclick="teamEntfernen(${i})">✕</button></div>`;
  });
  html += `<div class="add-form">
    <input class="admin-input" id="neuer-name" placeholder="Name hinzufügen…" type="text"
      onkeydown="if(event.key==='Enter')teamHinzufuegen()">
    <button class="add-btn" onclick="teamHinzufuegen()">+</button>
  </div></div>`;

  document.getElementById('admin-content').innerHTML = html;
}

function bereichUmbenennen(key) {
  const inp = document.getElementById(`bname-${key}`);
  const val = inp.value.trim();
  if(!val) return;
  BEREICHE[key].name = val;
  renderAdmin();
  showToast(`✓ "${val}" gespeichert`);
}

function aufgabeVerschieben(key, fromTz, i) {
  const sel = document.getElementById(`mv-${key}-${fromTz}-${i}`);
  const toTz = sel.value;
  if(!toTz) { showToast('Bitte Ziel wählen'); return; }
  const aufgabe = BEREICHE[key].aufgaben[fromTz].splice(i, 1)[0];
  BEREICHE[key].aufgaben[toTz].push(aufgabe);
  renderAdmin();
  showToast(`✓ Verschoben nach ${TAGESZEITEN.find(t=>t.key===toTz).label}`);
}

function aufgabeHoch(key, tz, i) {
  if(i===0) return;
  const arr = BEREICHE[key].aufgaben[tz];
  [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
  renderAdmin();
}
function aufgabeRunter(key, tz, i) {
  const arr = BEREICHE[key].aufgaben[tz];
  if(i>=arr.length-1) return;
  [arr[i], arr[i+1]] = [arr[i+1], arr[i]];
  renderAdmin();
}

async function zuweisungAendern(key, person) {
  if(!person) return;
  zuweisung[key] = person;
  try {
    await sbFetch(`salon_monatszuweisung?monat=eq.${MONAT_STR}&bereich=eq.${key}`,{method:'DELETE',prefer:''});
    await sbFetch('salon_monatszuweisung',{method:'POST',body:JSON.stringify({monat:MONAT_STR,bereich:key,person})});
    showToast(`✓ ${person} ist jetzt verantwortlich`);
    renderAdmin();
  } catch(e) { showToast('⚠ Fehler beim Speichern'); }
}

function aufgabeHinzufuegen(key,tz) {
  const inp = document.getElementById(`neu-${key}-${tz}`);
  const t = inp.value.trim(); if(!t) return;
  BEREICHE[key].aufgaben[tz].push(t); inp.value='';
  renderAdmin(); showToast('✓ Aufgabe hinzugefügt');
}
function aufgabeLoeschen(key,tz,i) {
  BEREICHE[key].aufgaben[tz].splice(i,1);
  renderAdmin(); showToast('Aufgabe entfernt');
}
function teamHinzufuegen() {
  const inp = document.getElementById('neuer-name');
  const n = inp.value.trim(); if(!n) return;
  TEAM.push(n); inp.value=''; renderAdmin(); showToast(`✓ ${n} hinzugefügt`);
}
function teamEntfernen(i) { TEAM.splice(i,1); renderAdmin(); showToast('Entfernt'); }

function setTab(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// REALTIME
function startRealtime() {
  const wsUrl = SUPABASE_URL.replace('https://','wss://')+'/realtime/v1/websocket?apikey='+SUPABASE_KEY+'&vsn=1.0.0';
  let ws, hb;
  function connect() {
    try { ws = new WebSocket(wsUrl); } catch(e) { setTimeout(connect,5000); return; }
    ws.onopen = () => {
      ws.send(JSON.stringify({topic:'realtime:public:salon_checks',event:'phx_join',payload:{config:{broadcast:{self:false},postgres_changes:[{event:'*',schema:'public',table:'salon_checks'}]}},ref:'1'}));
      ws.send(JSON.stringify({topic:'realtime:public:salon_monatszuweisung',event:'phx_join',payload:{config:{broadcast:{self:false},postgres_changes:[{event:'*',schema:'public',table:'salon_monatszuweisung'}]}},ref:'2'}));
      hb = setInterval(()=>{ if(ws.readyState===1) ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'})); },25000);
      zeigeSyncStatus(true);
    };
    ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if(msg.event==='postgres_changes') {
          const d = msg.payload?.data;
          if(!d) return;
          // Checks
          if(d.type==='INSERT'||d.type==='UPDATE') {
            const r = d.record;
            if(r.datum===HEUTE_STR) {
              const parts=r.aufgabe_index?r.aufgabe_index.split('|'):[];
              const k = parts.length===2?`${r.bereich}-${parts[0]}-${parts[1]}`:`${r.bereich}-${r.aufgabe_index}`;
              if(r.erledigt) checksHeute[k]={person:r.person,uhrzeit:r.uhrzeit};
              else delete checksHeute[k];
            }
            // Zuweisung
            if(r.monat) { zuweisung[r.bereich]=r.person; }
          } else if(d.type==='DELETE') {
            const r = d.old_record;
            if(r&&r.datum===HEUTE_STR) { const p=r.aufgabe_index?r.aufgabe_index.split('|'):[]; const dk=p.length===2?`${r.bereich}-${p[0]}-${p[1]}`:`${r.bereich}-${r.aufgabe_index}`; delete checksHeute[dk]; }
          }
          if(currentDetailBereich) { renderDetail(); renderTzTabs(); }
          renderMain();
        }
      } catch(e) {}
    };
    ws.onclose = () => { clearInterval(hb); zeigeSyncStatus(false); setTimeout(connect,3000); };
    ws.onerror = () => zeigeSyncStatus(false);
  }
  connect();
}

function zeigeSyncStatus(online) {
  const dot = document.getElementById('sync-dot');
  if(dot) dot.style.background = online?'#34C759':'#FF9500';
}

ladeAlles();
startRealtime();
</script>
