<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Salon Walenta">
<title>Salon Walenta – Verantwortung</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #F2F2F7;
    min-height: 100vh;
    max-width: 100%;
  }

  /* Top bar */
  .topbar {
    background: #1C1C1E;
    padding: env(safe-area-inset-top, 12px) 20px 14px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; }
  .topbar-left h1 { color: #fff; font-size: 20px; font-weight: 700; }
  .topbar-left .sub { color: #8E8E93; font-size: 13px; margin-top: 1px; }
  .admin-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 20px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  /* Admin screen */
  .admin-screen { display: none; position: fixed; inset: 0; background: #F2F2F7; z-index: 150; flex-direction: column; overflow-y: auto; }
  .admin-screen.open { display: flex; }
  .admin-section { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .admin-section-title { font-size: 13px; font-weight: 700; color: #8E8E93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .admin-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F2F2F7; }
  .admin-row-label { font-size: 15px; color: #1C1C1E; flex: 1; }
  .btn-small { border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-small.red { background: #FFE5E5; color: #C0392B; }
  .add-form { display: flex; gap: 8px; margin-top: 10px; }
  .admin-input { flex: 1; border: 1px solid #E5E5EA; border-radius: 8px; padding: 8px 12px; font-size: 15px; }
  .add-btn { background: #1C1C1E; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .admin-select { border: 1px solid #E5E5EA; border-radius: 8px; padding: 8px; font-size: 14px; }

  /* Content */
  .content { padding: 16px; padding-bottom: 90px; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #8E8E93;
    font-size: 15px;
  }

  /* Date banner */
  .date-banner {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .date-banner .dt { font-size: 16px; font-weight: 600; color: #1C1C1E; }
  .date-banner .dsub { font-size: 12px; color: #8E8E93; margin-top: 2px; }
  .check-badge {
    background: #1C1C1E;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 20px;
  }

  /* Section label */
  .slabel {
    font-size: 11px;
    font-weight: 600;
    color: #8E8E93;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin: 8px 0 8px 4px;
  }

  /* Area card */
  .area-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: opacity 0.1s;
  }
  .area-card:active { opacity: 0.7; }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .area-name { font-size: 16px; font-weight: 600; color: #1C1C1E; flex: 1; }
  .resp-pill {
    background: #F2F2F7;
    color: #3A3A3C;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    margin-left: 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .prog-row { display: flex; align-items: center; gap: 10px; }
  .prog-bg { flex: 1; height: 6px; background: #E5E5EA; border-radius: 3px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .prog-fill.done { background: #34C759; }
  .prog-fill.partial { background: #FF9500; }
  .prog-fill.empty { background: #E5E5EA; }
  .prog-text { font-size: 13px; color: #8E8E93; white-space: nowrap; }
  .arrow { color: #C7C7CC; font-size: 20px; }

  /* Info box */
  .info-box {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    color: #3A3A3C;
    line-height: 1.6;
    margin-top: 4px;
  }

  /* === DETAIL SCREEN === */
  .detail-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #F2F2F7;
    z-index: 100;
    flex-direction: column;
    max-width: 100%;
    overflow-y: auto;
  }
  .detail-screen.open { display: flex; }

  .detail-topbar {
    background: #1C1C1E;
    padding: env(safe-area-inset-top, 12px) 20px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    flex-shrink: 0;
  }
  .back-btn {
    color: #8E8E93;
    font-size: 15px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 6px;
  }
  .back-btn:active { opacity: 0.6; }
  .detail-topbar h2 { color: #fff; font-size: 18px; font-weight: 700; }
  .detail-topbar .dsub { color: #8E8E93; font-size: 13px; margin-top: 2px; }

  .detail-content { padding: 16px; padding-bottom: 40px; flex: 1; }

  .detail-header {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .resp-row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .resp-label { font-size: 13px; color: #8E8E93; }
  .resp-name { font-size: 13px; font-weight: 700; color: #1C1C1E; }

  /* Vortag banner */
  .vortag-banner {
    background: #FFF3CD;
    border-left: 3px solid #FF9500;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #856404;
    font-weight: 500;
  }

  /* Checklist */
  .checklist-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .check-item {
    display: flex;
    align-items: flex-start;
    padding: 14px 16px;
    border-bottom: 1px solid #F2F2F7;
    cursor: pointer;
    transition: background 0.1s;
  }
  .check-item:last-child { border-bottom: none; }
  .check-item:active { background: #F9F9F9; }
  .check-item.vortag { background: #FFFBF0; }
  .check-item.disabled { cursor: default; opacity: 0.85; }

  .cb {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid #D1D1D6;
    flex-shrink: 0;
    margin-right: 12px;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
  }
  .cb.checked { background: #34C759; border-color: #34C759; }
  .cb.checked::after {
    content: '';
    width: 6px;
    height: 11px;
    border: 2.5px solid #fff;
    border-top: none;
    border-left: none;
    transform: rotate(45deg) translateY(-1px);
  }

  .item-body { flex: 1; }
  .item-label { font-size: 15px; color: #1C1C1E; line-height: 1.4; }
  .item-label.done { color: #8E8E93; text-decoration: line-through; }
  .item-meta { font-size: 12px; color: #8E8E93; margin-top: 3px; }
  .vortag-tag { font-size: 11px; color: #FF9500; font-weight: 700; margin-right: 4px; }

  /* === MONTH SCREEN === */
  .month-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #F2F2F7;
    z-index: 100;
    flex-direction: column;
    max-width: 100%;
    overflow-y: auto;
  }
  .month-screen.open { display: flex; }

  .month-header-card {
    background: #fff;
    border-radius: 12px;
    padding: 18px 16px;
    margin-bottom: 16px;
    text-align: center;
  }
  .month-label-sm { font-size: 12px; color: #8E8E93; margin-bottom: 4px; }
  .month-name { font-size: 24px; font-weight: 700; color: #1C1C1E; }

  .month-card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .mc-area { font-size: 15px; font-weight: 600; color: #1C1C1E; margin-bottom: 10px; }
  .mc-person-row { display: flex; align-items: center; gap: 12px; }
  .mc-avatar {
    width: 38px;
    height: 38px;
    background: #1C1C1E;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .mc-name { font-size: 16px; font-weight: 600; color: #1C1C1E; }
  .mc-role { font-size: 12px; color: #8E8E93; margin-top: 1px; }
  .readonly-note {
    text-align: center;
    font-size: 12px;
    color: #C7C7CC;
    padding: 16px 0 8px;
  }

  /* Tab bar */
  .tabbar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: #fff;
    border-top: 1px solid #E5E5EA;
    display: flex;
    padding: 8px 0;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    padding: 4px 0;
  }
  .tab .ti { font-size: 24px; }
  .tab .tl { font-size: 10px; color: #8E8E93; font-weight: 500; }
  .tab.active .tl { color: #1C1C1E; font-weight: 700; }

  /* Name modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: #F2F2F7;
    border-radius: 20px 20px 0 0;
    padding: 12px 20px;
    padding-bottom: max(32px, env(safe-area-inset-bottom));
    width: 100%;
    max-width: 430px;
  }
  .modal-handle {
    width: 36px;
    height: 4px;
    background: #D1D1D6;
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .modal-title { font-size: 17px; font-weight: 700; color: #1C1C1E; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: #8E8E93; margin-bottom: 14px; }
  .name-btn {
    display: block;
    width: 100%;
    background: #fff;
    border: none;
    border-radius: 12px;
    padding: 15px 16px;
    font-size: 16px;
    font-weight: 500;
    color: #1C1C1E;
    text-align: left;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .name-btn:active { background: #E5E5EA; }
  .cancel-btn {
    display: block;
    width: 100%;
    background: #fff;
    border: none;
    border-radius: 12px;
    padding: 15px 16px;
    font-size: 16px;
    color: #8E8E93;
    text-align: center;
    margin-top: 4px;
    cursor: pointer;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #1C1C1E;
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- MAIN SCREEN -->
<div class="topbar">
  <div class="topbar-left">
    <h1>Heute</h1>
    <div class="sub">A Great Hair Day</div>
  </div>
  <button class="admin-btn" onclick="toggleAdmin()" title="Einstellungen">⚙️</button>
</div>

<!-- ADMIN SCREEN -->
<div class="admin-screen" id="admin-screen">
  <div class="detail-topbar">
    <div class="back-btn" onclick="toggleAdmin()">‹ Zurück</div>
    <h2>Einstellungen</h2>
    <div class="dsub">Aufgaben & Team verwalten</div>
  </div>
  <div class="detail-content" id="admin-content"></div>
</div>

<div class="content" id="main-content">
  <div class="loading">Wird geladen…</div>
</div>

<!-- DETAIL SCREEN -->
<div class="detail-screen" id="detail-screen">
  <div class="detail-topbar">
    <div class="back-btn" onclick="closeDetail()">‹ Zurück</div>
    <h2 id="detail-title"></h2>
    <div class="dsub" id="detail-sub">Checkliste heute</div>
  </div>
  <div class="detail-content" id="detail-content">
    <div class="loading">Wird geladen…</div>
  </div>
</div>

<!-- MONTH SCREEN -->
<div class="month-screen" id="month-screen">
  <div class="detail-topbar">
    <div class="back-btn" onclick="closeMonth()">‹ Zurück</div>
    <h2>Monat</h2>
    <div class="dsub">Aktuelle Zuweisung</div>
  </div>
  <div class="detail-content" id="month-content">
    <div class="loading">Wird geladen…</div>
  </div>
</div>

<!-- TAB BAR -->
<div class="tabbar">
  <div class="tab active" id="tab-heute" onclick="showMain()">
    <div class="ti">☑️</div>
    <div class="tl">Heute</div>
  </div>
  <div class="tab" id="tab-monat" onclick="showMonth()">
    <div class="ti">👤</div>
    <div class="tl">Monat</div>
  </div>
</div>

<!-- NAME MODAL -->
<div class="modal-overlay" id="modal" onclick="cancelModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">Wer hakt ab?</div>
    <div class="modal-sub">Wähle deinen Namen</div>
    <button class="name-btn" onclick="selectName('Mirjam')">Mirjam</button>
    <button class="name-btn" onclick="selectName('Alina')">Alina</button>
    <button class="name-btn" onclick="selectName('Mazen')">Mazen</button>
    <button class="name-btn" onclick="selectName('Hassan')">Hassan</button>
    <button class="name-btn" onclick="selectName('Ronya')">Ronya</button>
    <button class="cancel-btn" onclick="cancelModal()">Abbrechen</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────
const SUPABASE_URL = 'https://wrxlaltgtgkdomklgrlj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyeGxhbHRndGdrZG9ta2xncmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNDYwMzYsImV4cCI6MjA5OTgyMjAzNn0.Bw8ch-EJb_cLYTwxHdpjUJWgoCjje3Jc32pB0yiBS8g';

// ─── DATEN ────────────────────────────────────────────────────
const BEREICHE = {
  sauberkeit: {
    name: 'Sauberkeit & Versorgung',
    aufgaben: [
      'Kund:innenplätze sauber',
      'WC-Klopapier aufgefüllt',
      'Papierhandtücher aufgefüllt',
      'Farbmäntel nach jedem Gebrauch gewaschen',
      'Schneidemäntel kontrolliert und bei Bedarf gewaschen'
    ]
  },
  getraenke: {
    name: 'Getränkeversorgung',
    aufgaben: [
      'Getränke für Kund:innenbereich aufgefüllt',
      'Getränkestation oder Kühlschrank kontrolliert',
      'Mindestbestand geprüft',
      'Nachbestellbedarf markiert'
    ]
  }
};

const TEAM = ['Mirjam', 'Alina', 'Mazen', 'Hassan', 'Ronya'];

// ─── DATUM ────────────────────────────────────────────────────
const HEUTE = new Date();
const HEUTE_STR = formatDate(HEUTE);
const GESTERN = new Date(HEUTE); GESTERN.setDate(GESTERN.getDate() - 1);
const GESTERN_STR = formatDate(GESTERN);
const MONAT_STR = `${HEUTE.getFullYear()}-${String(HEUTE.getMonth()+1).padStart(2,'0')}`;

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONATE_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DATUM_ANZEIGE = `${WOCHENTAGE[HEUTE.getDay()]}, ${HEUTE.getDate()}. ${MONATE_DE[HEUTE.getMonth()]}`;
const MONAT_ANZEIGE = `${MONATE_DE[HEUTE.getMonth()]} ${HEUTE.getFullYear()}`;

// ─── STATE ────────────────────────────────────────────────────
let checksHeute = {};    // { "sauberkeit-0": {person, uhrzeit}, ... }
let checksGestern = {};
let zuweisung = {};      // { sauberkeit: "Alina", getraenke: "Mazen" }
let pendingBereich = null;
let pendingIndex = null;
let currentDetailBereich = null;

// ─── SUPABASE API ─────────────────────────────────────────────
async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    ...opts
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

async function ladeAlles() {
  try {
    // Zuweisung
    const zuw = await sbFetch(`salon_monatszuweisung?monat=eq.${MONAT_STR}&select=bereich,person`);
    zuweisung = {};
    zuw.forEach(z => { zuweisung[z.bereich] = z.person; });

    // Checks heute
    const ch = await sbFetch(`salon_checks?datum=eq.${HEUTE_STR}&select=bereich,aufgabe_index,person,uhrzeit`);
    checksHeute = {};
    ch.forEach(c => { checksHeute[`${c.bereich}-${c.aufgabe_index}`] = { person: c.person, uhrzeit: c.uhrzeit }; });

    // Checks gestern
    const cg = await sbFetch(`salon_checks?datum=eq.${GESTERN_STR}&select=bereich,aufgabe_index,erledigt`);
    checksGestern = {};
    cg.forEach(c => {
      if (c.erledigt) checksGestern[`${c.bereich}-${c.aufgabe_index}`] = true;
    });

    renderMain();
  } catch(e) {
    document.getElementById('main-content').innerHTML =
      `<div class="loading">⚠️ Verbindung fehlgeschlagen.<br><small>${e.message}</small></div>`;
  }
}

// ─── RENDER MAIN ──────────────────────────────────────────────
function renderMain() {
  const checkBadge = istFruehdienst() ? 'Morgencheck' : 'Abendcheck';

  let html = `
    <div class="date-banner">
      <div>
        <div class="dt">${DATUM_ANZEIGE}</div>
        <div class="dsub">Tagesübersicht</div>
      </div>
      <div class="check-badge">${checkBadge}</div>
    </div>
    <div class="slabel">Verantwortungsbereiche</div>
  `;

  Object.entries(BEREICHE).forEach(([key, bereich]) => {
    const total = bereich.aufgaben.length;
    const done = bereich.aufgaben.filter((_, i) => checksHeute[`${key}-${i}`]).length;
    const pct = Math.round((done / total) * 100);
    const fillClass = pct === 100 ? 'done' : pct > 0 ? 'partial' : 'empty';
    const person = zuweisung[key] || '–';

    html += `
      <div class="area-card" onclick="openDetail('${key}')">
        <div class="card-top">
          <div class="area-name">${bereich.name}</div>
          <div class="resp-pill">${person}</div>
        </div>
        <div class="prog-row">
          <div class="prog-bg"><div class="prog-fill ${fillClass}" style="width:${pct}%"></div></div>
          <div class="prog-text">${done} von ${total}</div>
          <div class="arrow">›</div>
        </div>
      </div>
    `;
  });

  html += `
    <div class="slabel" style="margin-top:4px;">Hinweis</div>
    <div class="info-box">
      Morgencheck: erste anwesende Person prüft alle Bereiche.<br>
      Abendcheck: letzte Person vor Salonschluss.
    </div>
  `;

  document.getElementById('main-content').innerHTML = html;
}

function istFruehdienst() {
  return HEUTE.getHours() < 13;
}

// ─── DETAIL ───────────────────────────────────────────────────
function openDetail(bereichKey) {
  currentDetailBereich = bereichKey;
  const bereich = BEREICHE[bereichKey];
  const person = zuweisung[bereichKey] || '–';

  document.getElementById('detail-title').textContent = bereich.name;
  document.getElementById('detail-screen').classList.add('open');

  renderDetail(bereichKey);
}

function renderDetail(bereichKey) {
  const bereich = BEREICHE[bereichKey];
  const person = zuweisung[bereichKey] || '–';

  // Offene Punkte von gestern zählen
  let vortag = 0;
  bereich.aufgaben.forEach((_, i) => {
    const key = `${bereichKey}-${i}`;
    if (!checksGestern[key] && !checksHeute[key]) vortag++;
  });
  // Nur anzeigen wenn gestern überhaupt Checks gab
  const hatGesternDaten = bereich.aufgaben.some((_, i) => checksGestern[`${bereichKey}-${i}`]);
  const vortagBanner = (hatGesternDaten && vortag > 0)
    ? `<div class="vortag-banner">⚠ ${vortag} Punkt${vortag > 1 ? 'e' : ''} von gestern offen geblieben</div>`
    : '';

  let items = '';
  bereich.aufgaben.forEach((aufgabe, i) => {
    const key = `${bereichKey}-${i}`;
    const check = checksHeute[key];
    const done = !!check;
    const warGesternOffen = hatGesternDaten && !checksGestern[key] && !done;

    const cbClass = done ? 'cb checked' : 'cb';
    const lblClass = done ? 'item-label done' : 'item-label';
    const rowClass = warGesternOffen ? 'check-item vortag' : 'check-item';
    const meta = done ? `${check.person} · ${check.uhrzeit}` : 'Noch nicht erledigt';
    const vtTag = warGesternOffen ? '<span class="vortag-tag">GESTERN OFFEN</span>' : '';

    items += `
      <div class="${rowClass}" onclick="toggleItem('${bereichKey}', ${i})">
        <div class="${cbClass}" id="cb-${bereichKey}-${i}"></div>
        <div class="item-body">
          <div class="${lblClass}" id="lbl-${bereichKey}-${i}">${vtTag}${aufgabe}</div>
          <div class="item-meta" id="meta-${bereichKey}-${i}">${meta}</div>
        </div>
      </div>
    `;
  });

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-header">
      <div style="font-size:17px;font-weight:700;color:#1C1C1E;">${bereich.name}</div>
      <div class="resp-row">
        <div class="resp-label">Verantwortlich ${MONATE_DE[HEUTE.getMonth()]}:</div>
        <div class="resp-name">${person}</div>
      </div>
    </div>
    ${vortagBanner}
    <div class="slabel">Checkliste – heute</div>
    <div class="checklist-card">${items}</div>
  `;
}

function closeDetail() {
  document.getElementById('detail-screen').classList.remove('open');
  currentDetailBereich = null;
  renderMain();
}

// ─── TOGGLE ───────────────────────────────────────────────────
function toggleItem(bereich, index) {
  const key = `${bereich}-${index}`;
  if (checksHeute[key]) {
    // Rückgängig machen
    uncheckeItem(bereich, index);
    return;
  }
  pendingBereich = bereich;
  pendingIndex = index;
  document.getElementById('modal').classList.add('open');
}

async function selectName(name) {
  document.getElementById('modal').classList.remove('open');
  const bereich = pendingBereich;
  const index = pendingIndex;
  const key = `${bereich}-${index}`;

  const now = new Date();
  const uhrzeit = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  // Optimistisch updaten
  checksHeute[key] = { person: name, uhrzeit };
  renderDetail(bereich);

  try {
    await sbFetch('salon_checks', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates',
      body: JSON.stringify({
        datum: HEUTE_STR,
        bereich,
        aufgabe_index: index,
        person: name,
        uhrzeit,
        erledigt: true
      })
    });
    showToast(`✓ ${name} hat abgehakt`);
  } catch(e) {
    // Rollback
    delete checksHeute[key];
    renderDetail(bereich);
    showToast('⚠ Fehler beim Speichern');
  }
}

async function uncheckeItem(bereich, index) {
  const key = `${bereich}-${index}`;
  const prev = checksHeute[key];
  delete checksHeute[key];
  renderDetail(bereich);

  try {
    await sbFetch(`salon_checks?datum=eq.${HEUTE_STR}&bereich=eq.${bereich}&aufgabe_index=eq.${index}`, {
      method: 'DELETE',
      prefer: ''
    });
  } catch(e) {
    checksHeute[key] = prev;
    renderDetail(bereich);
    showToast('⚠ Fehler beim Entfernen');
  }
}

function cancelModal() {
  document.getElementById('modal').classList.remove('open');
}

// ─── MONTH ────────────────────────────────────────────────────
async function showMonth() {
  document.getElementById('tab-heute').classList.remove('active');
  document.getElementById('tab-monat').classList.add('active');
  document.getElementById('month-screen').classList.add('open');

  let html = `
    <div class="month-header-card">
      <div class="month-label-sm">Aktuelle Zuweisung</div>
      <div class="month-name">${MONAT_ANZEIGE}</div>
    </div>
    <div class="slabel">Verantwortliche Personen</div>
  `;

  Object.entries(BEREICHE).forEach(([key, bereich]) => {
    const person = zuweisung[key] || '–';
    const initial = person.charAt(0);
    html += `
      <div class="month-card">
        <div class="mc-area">${bereich.name}</div>
        <div class="mc-person-row">
          <div class="mc-avatar">${initial}</div>
          <div>
            <div class="mc-name">${person}</div>
            <div class="mc-role">Hauptverantwortlich ${MONATE_DE[HEUTE.getMonth()]}</div>
          </div>
        </div>
      </div>
    `;
  });

  html += `<div class="readonly-note">Nur lesend – Änderungen werden von Mirjam eingetragen</div>`;
  document.getElementById('month-content').innerHTML = html;
}

function closeMonth() {
  document.getElementById('month-screen').classList.remove('open');
  document.getElementById('tab-monat').classList.remove('active');
  document.getElementById('tab-heute').classList.add('active');
}

function showMain() {
  document.getElementById('tab-monat').classList.remove('active');
  document.getElementById('tab-heute').classList.add('active');
  document.getElementById('month-screen').classList.remove('open');
}

// ─── TOAST ────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── START ────────────────────────────────────────────────────
ladeAlles();

// ─── ADMIN ────────────────────────────────────────────────────
function toggleAdmin() {
  const s = document.getElementById('admin-screen');
  s.classList.toggle('open');
  if(s.classList.contains('open')) renderAdmin();
}

function renderAdmin() {
  let html = '';
  // Zuweisungen
  html += '<div class="admin-section"><div class="admin-section-title">Monatliche Zuweisungen</div>';
  Object.entries(BEREICHE).forEach(([key,b]) => {
    const curr = zuweisung[key] || '';
    html += `<div class="admin-row"><div class="admin-row-label">${b.name}</div>
      <select class="admin-select" onchange="zuweisungAendern('${key}',this.value)">
        <option value="">–</option>
        ${TEAM.map(n=>`<option value="${n}" ${curr===n?'selected':''}>${n}</option>`).join('')}
      </select></div>`;
  });
  html += '</div>';
  // Aufgaben
  Object.entries(BEREICHE).forEach(([key,b]) => {
    html += `<div class="admin-section"><div class="admin-section-title">Aufgaben – ${b.name}</div>`;
    b.aufgaben.forEach((a,i) => {
      html += `<div class="admin-row"><div class="admin-row-label">${a}</div>
        <button class="btn-small red" onclick="aufgabeLoeschen('${key}',${i})">Löschen</button></div>`;
    });
    html += `<div class="add-form">
      <input class="admin-input" id="neue-aufgabe-${key}" placeholder="Neue Aufgabe…" type="text">
      <button class="add-btn" onclick="aufgabeHinzufuegen('${key}')">+ Hinzufügen</button>
    </div></div>`;
  });
  // Team
  html += '<div class="admin-section"><div class="admin-section-title">Team</div>';
  TEAM.forEach((name,i) => {
    html += `<div class="admin-row"><div class="admin-row-label">${name}</div>
      <button class="btn-small red" onclick="teamEntfernen(${i})">Entfernen</button></div>`;
  });
  html += `<div class="add-form">
    <input class="admin-input" id="neuer-name" placeholder="Name hinzufügen…" type="text">
    <button class="add-btn" onclick="teamHinzufuegen()">+ Hinzufügen</button>
  </div></div>`;
  document.getElementById('admin-content').innerHTML = html;
}

function aufgabeHinzufuegen(key) {
  const inp = document.getElementById('neue-aufgabe-'+key);
  const t = inp.value.trim(); if(!t) return;
  BEREICHE[key].aufgaben.push(t); inp.value = '';
  renderAdmin(); showToast('✓ Aufgabe hinzugefügt');
}
function aufgabeLoeschen(key,i) {
  BEREICHE[key].aufgaben.splice(i,1);
  renderAdmin(); showToast('Aufgabe entfernt');
}
function teamHinzufuegen() {
  const inp = document.getElementById('neuer-name');
  const n = inp.value.trim(); if(!n) return;
  TEAM.push(n); inp.value = '';
  renderAdmin(); showToast('✓ '+n+' hinzugefügt');
}
function teamEntfernen(i) {
  TEAM.splice(i,1);
  renderAdmin(); showToast('Entfernt');
}
</script>
