<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Salon Walenta">
<title>Salon Walenta – Verantwortung</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F2F2F7; min-height: 100vh; max-width: 430px; margin: 0 auto; }

.topbar { background: #1C1C1E; padding: env(safe-area-inset-top, 12px) 20px 14px; position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; }
.topbar-left h1 { color: #fff; font-size: 20px; font-weight: 700; }
.topbar-left .sub { color: #8E8E93; font-size: 13px; margin-top: 1px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
#sync-dot { width: 10px; height: 10px; border-radius: 50%; background: #FF9500; transition: background 0.5s; flex-shrink: 0; }
.admin-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; font-size: 20px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.content { padding: 16px; padding-bottom: 90px; }
.loading { text-align: center; padding: 60px 20px; color: #8E8E93; font-size: 15px; }

.date-banner { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.date-banner .dt { font-size: 16px; font-weight: 600; color: #1C1C1E; }
.date-banner .dsub { font-size: 12px; color: #8E8E93; margin-top: 2px; }
.check-badge { background: #1C1C1E; color: #fff; font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 20px; }

.slabel { font-size: 11px; font-weight: 600; color: #8E8E93; text-transform: uppercase; letter-spacing: 0.8px; margin: 8px 0 8px 4px; }

.area-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: opacity 0.1s; }
.area-card:active { opacity: 0.7; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.area-name { font-size: 16px; font-weight: 600; color: #1C1C1E; flex: 1; }
.resp-pill { background: #F2F2F7; color: #3A3A3C; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-left: 8px; white-space: nowrap; flex-shrink: 0; }
.prog-row { display: flex; align-items: center; gap: 10px; }
.prog-bg { flex: 1; height: 6px; background: #E5E5EA; border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.prog-fill.done { background: #34C759; }
.prog-fill.partial { background: #FF9500; }
.prog-fill.empty { background: #E5E5EA; }
.prog-text { font-size: 13px; color: #8E8E93; white-space: nowrap; }
.arrow { color: #C7C7CC; font-size: 20px; }

.info-box { background: #fff; border-radius: 12px; padding: 14px 16px; font-size: 13px; color: #3A3A3C; line-height: 1.6; margin-top: 4px; }

/* DETAIL */
.detail-screen { display: none; position: fixed; inset: 0; background: #F2F2F7; z-index: 100; flex-direction: column; max-width: 430px; margin: 0 auto; }
.detail-screen.open { display: flex; }
.detail-topbar { background: #1C1C1E; padding: env(safe-area-inset-top, 12px) 20px 14px; flex-shrink: 0; }
.back-btn { color: #8E8E93; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 6px; }
.back-btn:active { opacity: 0.6; }
.detail-topbar h2 { color: #fff; font-size: 18px; font-weight: 700; }
.detail-resp { color: #8E8E93; font-size: 13px; margin-top: 3px; }
.detail-resp span { color: #fff; font-weight: 600; }

/* Tageszeit Tabs */
.tageszeit-tabs { display: flex; gap: 6px; padding: 12px 16px 0; background: #F2F2F7; flex-shrink: 0; overflow-x: auto; }
.tz-tab { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; background: #E5E5EA; color: #3A3A3C; border: none; transition: all 0.15s; }
.tz-tab.active { background: #1C1C1E; color: #fff; }
.tz-tab .tz-count { font-size: 11px; opacity: 0.7; margin-left: 4px; }

.detail-content { padding: 12px 16px; flex: 1; overflow-y: auto; padding-bottom: 40px; }

/* Checkliste vereinfacht */
.checklist-card { background: #fff; border-radius: 12px; overflow: hidden; }
.check-item { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid #F2F2F7; cursor: pointer; transition: background 0.1s; min-height: 52px; }
.check-item:last-child { border-bottom: none; }
.check-item:active { background: #F9F9F9; }
.check-item.vortag { background: #FFFBF0; }

.cb { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #D1D1D6; flex-shrink: 0; margin-right: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.cb.checked { background: #34C759; border-color: #34C759; }
.cb.checked::after { content: ''; width: 6px; height: 11px; border: 2.5px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px); }

.item-body { flex: 1; }
.item-label { font-size: 15px; color: #1C1C1E; line-height: 1.3; }
.item-label.done { color: #C7C7CC; text-decoration: line-through; }
.item-meta { font-size: 11px; color: #8E8E93; margin-top: 2px; }
.vortag-dot { display: inline-block; width: 6px; height: 6px; background: #FF9500; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.vortag-banner { background: #FFF3CD; border-left: 3px solid #FF9500; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 12px; color: #856404; font-weight: 500; }
.empty-state { text-align: center; padding: 40px 20px; color: #8E8E93; font-size: 14px; }

/* MONTH */
.month-screen { display: none; position: fixed; inset: 0; background: #F2F2F7; z-index: 100; flex-direction: column; max-width: 430px; margin: 0 auto; overflow-y: auto; }
.month-screen.open { display: flex; }
.month-header-card { background: #fff; border-radius: 12px; padding: 18px 16px; margin-bottom: 16px; text-align: center; }
.month-label-sm { font-size: 12px; color: #8E8E93; margin-bottom: 4px; }
.month-name { font-size: 24px; font-weight: 700; color: #1C1C1E; }
.month-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.mc-area { font-size: 15px; font-weight: 600; color: #1C1C1E; margin-bottom: 10px; }
.mc-person-row { display: flex; align-items: center; gap: 12px; }
.mc-avatar { width: 38px; height: 38px; background: #1C1C1E; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: 700; flex-shrink: 0; }
.mc-name { font-size: 16px; font-weight: 600; color: #1C1C1E; }
.mc-role { font-size: 12px; color: #8E8E93; margin-top: 1px; }

/* ADMIN */
.admin-screen { display: none; position: fixed; inset: 0; background: #F2F2F7; z-index: 150; flex-direction: column; max-width: 430px; margin: 0 auto; overflow-y: auto; }
.admin-screen.open { display: flex; }
.admin-topbar { background: #1C1C1E; padding: env(safe-area-inset-top, 12px) 20px 14px; flex-shrink: 0; }
.admin-content { padding: 16px; padding-bottom: 40px; }
.admin-section { background: #fff; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.admin-section-title { font-size: 13px; font-weight: 700; color: #8E8E93; text-transform: uppercase; letter-spacing: 0.5px; padding: 14px 16px 8px; border-bottom: 1px solid #F2F2F7; }
.admin-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #F2F2F7; }
.admin-row:last-child { border-bottom: none; }
.admin-row-label { font-size: 15px; color: #1C1C1E; flex: 1; line-height: 1.3; }
.admin-row-sub { font-size: 11px; color: #8E8E93; margin-top: 2px; }
.btn-small { border: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; background: #F2F2F7; color: #1C1C1E; }
.btn-small.red { background: #FFE5E5; color: #C0392B; }
.admin-select { border: 1px solid #E5E5EA; border-radius: 8px; padding: 8px 10px; font-size: 14px; color: #1C1C1E; background: #fff; }
.add-form { padding: 12px 16px; display: flex; gap: 8px; }

/* TABS */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: #fff; border-top: 1px solid #E5E5EA; display: flex; padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); z-index: 50; }

.tab .ti { font-size: 22px; }
.tab .tl { font-size: 10px; color: #8E8E93; font-weight: 500; }
.tab.active .tl { color: #1C1C1E; font-weight: 700; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-sheet { background: #F2F2F7; border-radius: 20px 20px 0 0; padding: 12px 20px; padding-bottom: max(32px, env(safe-area-inset-bottom)); width: 100%; max-width: 430px; }
.modal-handle { width: 36px; height: 4px; background: #D1D1D6; border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-size: 17px; font-weight: 700; color: #1C1C1E; margin-bottom: 14px; }
.name-btn { display: block; width: 100%; background: #fff; border: none; border-radius: 12px; padding: 15px 16px; font-size: 16px; font-weight: 500; color: #1C1C1E; text-align: left; margin-bottom: 8px; cursor: pointer; }
.name-btn:active { background: #E5E5EA; }
.cancel-btn { display: block; width: 100%; background: #fff; border: none; border-radius: 12px; padding: 15px 16px; font-size: 16px; color: #8E8E93; text-align: center; margin-top: 4px; cursor: pointer; }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1C1C1E; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 500; z-index: 300; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
.toast.show { opacity: 1; }
</style>
</head>

const TAGESZEITEN = [
  { key: 'morgens', label: 'Morgens', icon: '🌅' },
  { key: 'untertags', label: 'Untertags', icon: '☀️' },
  { key: 'abends', label: 'Abends', icon: '🌙' },
  { key: 'woechentlich', label: '1× Woche', icon: '📋' }
];

let TEAM = ['Mirjam','Alina','Mazen','Hassan','Ronya'];

const HEUTE = new Date();
const HEUTE_STR = fmtDate(HEUTE);
const GESTERN = new Date(HEUTE); GESTERN.setDate(GESTERN.getDate()-1);
const GESTERN_STR = fmtDate(GESTERN);
const MONAT_STR = `${HEUTE.getFullYear()}-${String(HEUTE.getMonth()+1).padStart(2,'0')}`;
const WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONATE_DE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DATUM_ANZEIGE = `${WOCHENTAGE[HEUTE.getDay()]}, ${HEUTE.getDate()}. ${MONATE_DE[HEUTE.getMonth()]}`;
const MONAT_ANZEIGE = `${MONATE_DE[HEUTE.getMonth()]} ${HEUTE.getFullYear()}`;

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let checksHeute = {};
let checksGestern = {};
let zuweisung = {};
let pendingBereich = null;
let pendingTageszeit = null;
let pendingIndex = null;
let currentDetailBereich = null;
let currentTageszeit = 'morgens';

async function sbFetch(path, opts={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': opts.prefer||'return=representation', ...opts.headers },
    ...opts
  });
  const text = await res.text();
  if(!res.ok) throw new Error(text);
  return text ? JSON.parse(text) : [];
}

async function ladeAlles() {
  try {
    const zuw = await sbFetch(`salon_monatszuweisung?monat=eq.${MONAT_STR}&select=bereich,person`);
    zuweisung = {};
    zuw.forEach(z => { zuweisung[z.bereich] = z.person; });

    const ch = await sbFetch(`salon_checks?datum=eq.${HEUTE_STR}&select=bereich,tageszeit,aufgabe_index,person,uhrzeit`);
    checksHeute = {};
    ch.forEach(c => { checksHeute[`${c.bereich}-${c.tageszeit}-${c.aufgabe_index}`] = {person:c.person,uhrzeit:c.uhrzeit}; });

    const cg = await sbFetch(`salon_checks?datum=eq.${GESTERN_STR}&select=bereich,tageszeit,aufgabe_index,erledigt`);
    checksGestern = {};
    cg.forEach(c => { if(c.erledigt) checksGestern[`${c.bereich}-${c.tageszeit}-${c.aufgabe_index}`] = true; });

    renderMain();
  } catch(e) {
    document.getElementById('main-content').innerHTML = `<div class="loading">⚠️ Verbindung fehlgeschlagen.<br><small>${e.message}</small></div>`;
  }
}

function getTotalUndDone(bereichKey) {
  const b = BEREICHE[bereichKey];
  let total = 0, done = 0;
  // Nur morgens, untertags, abends (nicht wöchentlich) für Tagesfortschritt
  const tzKeys = HEUTE.getDay() === 0 || HEUTE.getDay() === 6 ? ['morgens','untertags','abends','woechentlich'] : ['morgens','untertags','abends'];
  tzKeys.forEach(tz => {
    (b.aufgaben[tz]||[]).forEach((_,i) => {
      total++;
      if(checksHeute[`${bereichKey}-${tz}-${i}`]) done++;
    });
  });
  return {total, done};
}

function renderMain() {
  const badge = HEUTE.getHours() < 13 ? 'Morgencheck' : 'Abendcheck';
  let html = `
    <div class="date-banner">
      <div><div class="dt">${DATUM_ANZEIGE}</div><div class="dsub">Tagesübersicht</div></div>
      <div class="check-badge">${badge}</div>
    </div>
    <div class="slabel">Verantwortungsbereiche</div>`;

  Object.entries(BEREICHE).forEach(([key,b]) => {
    const {total,done} = getTotalUndDone(key);
    const pct = total > 0 ? Math.round((done/total)*100) : 0;
    const fc = pct===100?'done':pct>0?'partial':'empty';
    const person = zuweisung[key]||'–';
    html += `
      <div class="area-card" onclick="openDetail('${key}')">
        <div class="card-top"><div class="area-name">${b.name}</div><div class="resp-pill">${person}</div></div>
        <div class="prog-row">
          <div class="prog-bg"><div class="prog-fill ${fc}" style="width:${pct}%"></div></div>
          <div class="prog-text">${done} von ${total}</div>
          <div class="arrow">›</div>
        </div>
      </div>`;
  });

  html += `<div class="slabel" style="margin-top:4px;">Hinweis</div>
    <div class="info-box">Morgencheck: erste anwesende Person.<br>Abendcheck: letzte Person vor Salonschluss.</div>`;
  document.getElementById('main-content').innerHTML = html;
}

function openDetail(key) {
  currentDetailBereich = key;
  currentTageszeit = HEUTE.getHours() < 13 ? 'morgens' : HEUTE.getHours() < 17 ? 'untertags' : 'abends';
  const b = BEREICHE[key];
  const person = zuweisung[key]||'–';
  document.getElementById('detail-title').textContent = b.name;
  document.getElementById('detail-resp').innerHTML = `Verantwortlich: <span>${person}</span>`;
  document.getElementById('detail-screen').classList.add('open');
  renderTzTabs();
  renderDetail();
}

function renderTzTabs() {
  const key = currentDetailBereich;
  const b = BEREICHE[key];
  let html = '';
  TAGESZEITEN.forEach(tz => {
    const aufgaben = b.aufgaben[tz.key]||[];
    const done = aufgaben.filter((_,i)=>checksHeute[`${key}-${tz.key}-${i}`]).length;
    const active = tz.key === currentTageszeit ? ' active' : '';
    html += `<button class="tz-tab${active}" onclick="switchTz('${tz.key}')">
      ${tz.icon} ${tz.label}<span class="tz-count">${done}/${aufgaben.length}</span>
    </button>`;
  });
  document.getElementById('tz-tabs').innerHTML = html;
}

function switchTz(tz) {
  currentTageszeit = tz;
  renderTzTabs();
  renderDetail();
}

function renderDetail() {
  const key = currentDetailBereich;
  const tz = currentTageszeit;
  const aufgaben = BEREICHE[key].aufgaben[tz]||[];

  const hatGestern = aufgaben.some((_,i)=>checksGestern[`${key}-${tz}-${i}`]);
  const vortagOffen = hatGestern ? aufgaben.filter((_,i)=>!checksGestern[`${key}-${tz}-${i}`]&&!checksHeute[`${key}-${tz}-${i}`]).length : 0;
  let banner = vortagOffen > 0 ? `<div class="vortag-banner">⚠ ${vortagOffen} Punkt${vortagOffen>1?'e':''} von gestern noch offen</div>` : '';

  if(aufgaben.length === 0) {
    document.getElementById('detail-content').innerHTML = `<div class="empty-state">Keine Aufgaben für diesen Zeitraum</div>`;
    return;
  }

  let items = '';
  aufgaben.forEach((aufgabe,i) => {
    const k = `${key}-${tz}-${i}`;
    const check = checksHeute[k];
    const done = !!check;
    const vortag = hatGestern && !checksGestern[k] && !done;
    items += `
      <div class="check-item${vortag?' vortag':''}" onclick="toggleItem('${key}','${tz}',${i})">
        <div class="cb${done?' checked':''}"></div>
        <div class="item-body">
          <div class="item-label${done?' done':''}">${vortag?'<span class="vortag-dot"></span>':''}${aufgabe}</div>
          ${done?`<div class="item-meta">${check.person} · ${check.uhrzeit}</div>`:''}
        </div>
      </div>`;
  });

  document.getElementById('detail-content').innerHTML = `${banner}<div class="checklist-card">${items}</div>`;
}

function closeDetail() {
  document.getElementById('detail-screen').classList.remove('open');
  currentDetailBereich = null;
  renderMain();
}

function toggleItem(bereich, tz, index) {
  const k = `${bereich}-${tz}-${index}`;
  if(checksHeute[k]) { uncheckeItem(bereich,tz,index); return; }
  pendingBereich = bereich;
  pendingTageszeit = tz;
  pendingIndex = index;
  document.getElementById('name-list').innerHTML = TEAM.map(n=>`<button class="name-btn" onclick="selectName('${n}')">${n}</button>`).join('');
  document.getElementById('modal').classList.add('open');
}

async function selectName(name) {
  document.getElementById('modal').classList.remove('open');
  const bereich = pendingBereich, tz = pendingTageszeit, index = pendingIndex;
  const k = `${bereich}-${tz}-${index}`;
  const now = new Date();
  const uhrzeit = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  checksHeute[k] = {person:name,uhrzeit};
  renderDetail(); renderTzTabs();
  try {
    await sbFetch('salon_checks',{method:'POST',prefer:'resolution=merge-duplicates',body:JSON.stringify({datum:HEUTE_STR,bereich,tageszeit:tz,aufgabe_index:index,person:name,uhrzeit,erledigt:true})});
    showToast(`✓ ${name}`);
  } catch(e) { delete checksHeute[k]; renderDetail(); showToast('⚠ Fehler'); }
}

async function uncheckeItem(bereich,tz,index) {
  const k = `${bereich}-${tz}-${index}`, prev = checksHeute[k];
  delete checksHeute[k]; renderDetail(); renderTzTabs();
  try { await sbFetch(`salon_checks?datum=eq.${HEUTE_STR}&bereich=eq.${bereich}&tageszeit=eq.${tz}&aufgabe_index=eq.${index}`,{method:'DELETE',prefer:''}); }
  catch(e) { checksHeute[k]=prev; renderDetail(); }
}

function cancelModal() { document.getElementById('modal').classList.remove('open'); }

function showMonth() {
  setTab('monat');
  document.getElementById('month-screen').classList.add('open');
  let html = `<div class="month-header-card"><div class="month-label-sm">Aktuelle Zuweisung</div><div class="month-name">${MONAT_ANZEIGE}</div></div><div class="slabel">Verantwortliche Personen</div>`;
  Object.entries(BEREICHE).forEach(([key,b]) => {
    const person = zuweisung[key]||'–';
    html += `<div class="month-card"><div class="mc-area">${b.name}</div><div class="mc-person-row"><div class="mc-avatar">${person.charAt(0)}</div><div><div class="mc-name">${person}</div><div class="mc-role">Hauptverantwortlich ${MONATE_DE[HEUTE.getMonth()]}</div></div></div></div>`;
  });
  document.getElementById('month-content').innerHTML = html;
}
function closeMonth() { document.getElementById('month-screen').classList.remove('open'); setTab('heute'); }
function showMain() { setTab('heute'); document.getElementById('month-screen').classList.remove('open'); }

function toggleAdmin() {
  const s = document.getElementById('admin-screen');
  if(s.classList.contains('open')) { s.classList.remove('open'); return; }
  const pw = prompt('Admin-Passwort:');

  else if(pw !== null) showToast('❌ Falsches Passwort');
}
function closeAdmin() { document.getElementById('admin-screen').classList.remove('open'); }

function renderAdmin() {
  let html = '';
  // Monatszuweisung
  html += `<div class="admin-section"><div class="admin-section-title">Monatszuweisung – ${MONAT_ANZEIGE}</div>`;
  Object.entries(BEREICHE).forEach(([key,b]) => {
    const curr = zuweisung[key]||'';
    html += `<div class="admin-row">
      <div><div class="admin-row-label">${b.name}</div><div class="admin-row-sub">Verantwortlich: ${curr||'–'}</div></div>
      <select class="admin-select" onchange="zuweisungAendern('${key}',this.value)">
        <option value="">–</option>
        ${TEAM.map(n=>`<option value="${n}"${curr===n?' selected':''}>${n}</option>`).join('')}
      </select></div>`;
  });
  html += '</div>';

  // Aufgaben pro Bereich und Tageszeit
  Object.entries(BEREICHE).forEach(([key,b]) => {
    TAGESZEITEN.forEach(tz => {
      const aufgaben = b.aufgaben[tz.key]||[];
      html += `<div class="admin-section"><div class="admin-section-title">${b.name} – ${tz.label}</div>`;
      aufgaben.forEach((a,i) => {
        html += `<div class="admin-row"><div class="admin-row-label">${a}</div>
          <button class="btn-small red" onclick="aufgabeLoeschen('${key}','${tz.key}',${i})">Löschen</button></div>`;
      });
      html += `<div class="add-form">
        <input class="admin-input" id="neu-${key}-${tz.key}" placeholder="Neue Aufgabe…" type="text">
        <button class="add-btn" onclick="aufgabeHinzufuegen('${key}','${tz.key}')">+</button>
      </div></div>`;
    });
  });

  // Team
  html += '<div class="admin-section"><div class="admin-section-title">Team</div>';
  TEAM.forEach((name,i) => {
    html += `<div class="admin-row"><div class="admin-row-label">${name}</div>
      <button class="btn-small red" onclick="teamEntfernen(${i})">Entfernen</button></div>`;
  });
  html += `<div class="add-form">
    <input class="admin-input" id="neuer-name" placeholder="Name hinzufügen…" type="text">
    <button class="add-btn" onclick="teamHinzufuegen()">+</button>
  </div></div>`;

  document.getElementById('admin-content').innerHTML = html;
}

async function zuweisungAendern(key, person) {
  if(!person) return;
  zuweisung[key] = person;
  try {
    await sbFetch(`salon_monatszuweisung?monat=eq.${MONAT_STR}&bereich=eq.${key}`,{method:'DELETE',prefer:''});
    await sbFetch('salon_monatszuweisung',{method:'POST',body:JSON.stringify({monat:MONAT_STR,bereich:key,person})});
    showToast(`✓ ${person} ist jetzt verantwortlich`);
    renderAdmin();
  } catch(e) { showToast('⚠ Fehler beim Speichern'); }
}

function aufgabeHinzufuegen(key,tz) {
  const inp = document.getElementById(`neu-${key}-${tz}`);
  const t = inp.value.trim(); if(!t) return;
  BEREICHE[key].aufgaben[tz].push(t); inp.value='';
  renderAdmin(); showToast('✓ Aufgabe hinzugefügt');
}
function aufgabeLoeschen(key,tz,i) {
  BEREICHE[key].aufgaben[tz].splice(i,1);
  renderAdmin(); showToast('Aufgabe entfernt');
}
function teamHinzufuegen() {
  const inp = document.getElementById('neuer-name');
  const n = inp.value.trim(); if(!n) return;
  TEAM.push(n); inp.value=''; renderAdmin(); showToast(`✓ ${n} hinzugefügt`);
}
function teamEntfernen(i) { TEAM.splice(i,1); renderAdmin(); showToast('Entfernt'); }

function setTab(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// REALTIME
function startRealtime() {
  const wsUrl = SUPABASE_URL.replace('https://','wss://')+'/realtime/v1/websocket?apikey='+SUPABASE_KEY+'&vsn=1.0.0';
  let ws, hb;
  function connect() {
    try { ws = new WebSocket(wsUrl); } catch(e) { setTimeout(connect,5000); return; }
    ws.onopen = () => {
      ws.send(JSON.stringify({topic:'realtime:public:salon_checks',event:'phx_join',payload:{config:{broadcast:{self:false},postgres_changes:[{event:'*',schema:'public',table:'salon_checks'}]}},ref:'1'}));
      ws.send(JSON.stringify({topic:'realtime:public:salon_monatszuweisung',event:'phx_join',payload:{config:{broadcast:{self:false},postgres_changes:[{event:'*',schema:'public',table:'salon_monatszuweisung'}]}},ref:'2'}));
      hb = setInterval(()=>{ if(ws.readyState===1) ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'})); },25000);
      zeigeSyncStatus(true);
    };
    ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if(msg.event==='postgres_changes') {
          const d = msg.payload?.data;
          if(!d) return;
          // Checks
          if(d.type==='INSERT'||d.type==='UPDATE') {
            const r = d.record;
            if(r.datum===HEUTE_STR) {
              const k = `${r.bereich}-${r.tageszeit}-${r.aufgabe_index}`;
              if(r.erledigt) checksHeute[k]={person:r.person,uhrzeit:r.uhrzeit};
              else delete checksHeute[k];
            }
            // Zuweisung
            if(r.monat) { zuweisung[r.bereich]=r.person; }
          } else if(d.type==='DELETE') {
            const r = d.old_record;
            if(r&&r.datum===HEUTE_STR) delete checksHeute[`${r.bereich}-${r.tageszeit}-${r.aufgabe_index}`];
          }
          if(currentDetailBereich) { renderDetail(); renderTzTabs(); }
          renderMain();
        }
      } catch(e) {}
    };
    ws.onclose = () => { clearInterval(hb); zeigeSyncStatus(false); setTimeout(connect,3000); };
    ws.onerror = () => zeigeSyncStatus(false);
  }
  connect();
}

function zeigeSyncStatus(online) {
  const dot = document.getElementById('sync-dot');
  if(dot) dot.style.background = online?'#34C759':'#FF9500';
}

ladeAlles();
startRealtime();
