async function sbFetch(path, opts={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {

    ...opts
  });
  const text = await res.text();

}

async function ladeAlles() {
  try {
    const zuw = await sbFetch(`salon_monatszuweisung?monat=eq.${MONAT_STR}&select=bereich,person`);

    const ch = await sbFetch(`salon_checks?datum=eq.${HEUTE_STR}&select=bereich,tageszeit,aufgabe_index,person,uhrzeit`);
    checksHeute = {};
    ch.forEach(c => { checksHeute[`${c.bereich}-${c.tageszeit}-${c.aufgabe_index}`] = {person:c.person,uhrzeit:c.uhrzeit}; });

function getTotalUndDone(bereichKey) {
  const b = BEREICHE[bereichKey];
  let total = 0, done = 0;
  // Nur morgens, untertags, abends (nicht wöchentlich) für Tagesfortschritt
  const tzKeys = HEUTE.getDay() === 0 || HEUTE.getDay() === 6 ? ['morgens','untertags','abends','woechentlich'] : ['morgens','untertags','abends'];
  tzKeys.forEach(tz => {
    (b.aufgaben[tz]||[]).forEach((_,i) => {
      total++;
      if(checksHeute[`${bereichKey}-${tz}-${i}`]) done++;
    });
  });
  return {total, done};
}

function renderMain() {
  const badge = HEUTE.getHours() < 13 ? 'Morgencheck' : 'Abendcheck';

    <div class="slabel">Verantwortungsbereiche</div>`;

  Object.entries(BEREICHE).forEach(([key,b]) => {
    const {total,done} = getTotalUndDone(key);
    const pct = total > 0 ? Math.round((done/total)*100) : 0;
    const fc = pct===100?'done':pct>0?'partial':'empty';
    const person = zuweisung[key]||'–';

    // Mini-Zeilen für Morgens / Untertags / Abends
    const tzMini = ['morgens','untertags','abends'].map(tzKey => {
      const tzLabel = tzKey==='morgens'?'Morgens':tzKey==='untertags'?'Untertags':'Abends';
      const aufgaben = b.aufgaben[tzKey]||[];
      const tzDone = aufgaben.filter((_,i)=>checksHeute[`${key}-${tzKey}-${i}`]).length;
      const tzTotal = aufgaben.length;
      const cls = tzTotal===0?'none':tzDone===tzTotal?'all-done':tzDone>0?'partial':'none';
      return `<div class="tz-mini" onclick="event.stopPropagation();openDetailTz('${key}','${tzKey}')">
        <div class="tz-mini-label">${tzLabel}</div>
        <div class="tz-mini-count ${cls}">${tzDone}/${tzTotal}</div>
      </div>`;
    }).join('');

    html += `
      <div class="area-card" onclick="openDetail('${key}')">

function renderTzTabs() {
  const key = currentDetailBereich;
  const b = BEREICHE[key];
  let html = '';
  TAGESZEITEN.forEach(tz => {
    const aufgaben = b.aufgaben[tz.key]||[];
    const done = aufgaben.filter((_,i)=>checksHeute[`${key}-${tz.key}-${i}`]).length;
    const active = tz.key === currentTageszeit ? ' active' : '';
    html += `<button class="tz-tab${active}" onclick="switchTz('${tz.key}')">
      ${tz.icon} ${tz.label}<span class="tz-count">${done}/${aufgaben.length}</span>
    </button>`;
  });
  document.getElementById('tz-tabs').innerHTML = html;
}

function switchTz(tz) {
  currentTageszeit = tz;
  renderTzTabs();
  renderDetail();
}

function renderDetail() {
  const key = currentDetailBereich;
  const tz = currentTageszeit;
  const aufgaben = BEREICHE[key].aufgaben[tz]||[];

  const hatGestern = aufgaben.some((_,i)=>checksGestern[`${key}-${tz}-${i}`]);
  const vortagOffen = hatGestern ? aufgaben.filter((_,i)=>!checksGestern[`${key}-${tz}-${i}`]&&!checksHeute[`${key}-${tz}-${i}`]).length : 0;
  let banner = vortagOffen > 0 ? `<div class="vortag-banner">⚠ ${vortagOffen} Punkt${vortagOffen>1?'e':''} von gestern noch offen</div>` : '';

  if(aufgaben.length === 0) {
    document.getElementById('detail-content').innerHTML = `<div class="empty-state">Keine Aufgaben für diesen Zeitraum</div>`;
    return;
  }

  let items = '';
  aufgaben.forEach((aufgabe,i) => {
    const k = `${key}-${tz}-${i}`;
    const check = checksHeute[k];
    const done = !!check;
    const vortag = hatGestern && !checksGestern[k] && !done;
    items += `
      <div class="check-item${vortag?' vortag':''}" onclick="toggleItem('${key}','${tz}',${i})">
        <div class="cb${done?' checked':''}"></div>
        <div class="item-body">
          <div class="item-label${done?' done':''}">${vortag?'<span class="vortag-dot"></span>':''}${aufgabe}</div>
          ${done?`<div class="item-meta">${check.person} · ${check.uhrzeit}</div>`:''}
        </div>
      </div>`;
  });

  document.getElementById('detail-content').innerHTML = `${banner}<div class="checklist-card">${items}</div>`;
}

async function selectName(name) {
  document.getElementById('modal').classList.remove('open');

  const k = `${bereich}-${tz}-${index}`;

// REALTIME
function startRealtime() {
  const wsUrl = SUPABASE_URL.replace('https://','wss://')+'/realtime/v1/websocket?apikey='+SUPABASE_KEY+'&vsn=1.0.0';
  let ws, hb;
  function connect() {
    try { ws = new WebSocket(wsUrl); } catch(e) { setTimeout(connect,5000); return; }
    ws.onopen = () => {
      ws.send(JSON.stringify({topic:'realtime:public:salon_checks',event:'phx_join',payload:{config:{broadcast:{self:false},postgres_changes:[{event:'*',schema:'public',table:'salon_checks'}]}},ref:'1'}));
      ws.send(JSON.stringify({topic:'realtime:public:salon_monatszuweisung',event:'phx_join',payload:{config:{broadcast:{self:false},postgres_changes:[{event:'*',schema:'public',table:'salon_monatszuweisung'}]}},ref:'2'}));
      hb = setInterval(()=>{ if(ws.readyState===1) ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'})); },25000);
      zeigeSyncStatus(true);
    };
    ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if(msg.event==='postgres_changes') {
          const d = msg.payload?.data;
          if(!d) return;
          // Checks
          if(d.type==='INSERT'||d.type==='UPDATE') {
            const r = d.record;
            if(r.datum===HEUTE_STR) {
              const k = `${r.bereich}-${r.tageszeit}-${r.aufgabe_index}`;
              if(r.erledigt) checksHeute[k]={person:r.person,uhrzeit:r.uhrzeit};
              else delete checksHeute[k];
            }
            // Zuweisung
            if(r.monat) { zuweisung[r.bereich]=r.person; }
          } else if(d.type==='DELETE') {
            const r = d.old_record;
            if(r&&r.datum===HEUTE_STR) delete checksHeute[`${r.bereich}-${r.tageszeit}-${r.aufgabe_index}`];
          }
          if(currentDetailBereich) { renderDetail(); renderTzTabs(); }
          renderMain();
        }
      } catch(e) {}
    };
    ws.onclose = () => { clearInterval(hb); zeigeSyncStatus(false); setTimeout(connect,3000); };
    ws.onerror = () => zeigeSyncStatus(false);
  }
  connect();
}

function zeigeSyncStatus(online) {
  const dot = document.getElementById('sync-dot');
  if(dot) dot.style.background = online?'#34C759':'#FF9500';
}

  }
}

// ── FIXER EINKAUF (Stammliste pro Kategorie) ────────────────────────────────



function ekRenderFixItem(it) {
  const mengeBadge = it.menge ? `<span class="ek-meta-badge">🛒 ${it.menge}</span>` : '';
  const minBadge = it.mindeststand ? `<span class="ek-meta-badge warn">⚠ Min: ${it.mindeststand}</span>` : '';
  const metaRow = (it.menge || it.mindeststand) ? `<div class="ek-item-meta">${mengeBadge}${minBadge}</div>` : '';

  if (ekEditItemId===it.id) {
    return `<div class="ek-item" style="flex-direction:column;align-items:stretch;gap:6px;padding:12px 16px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="ek-cb${it.erledigt?' checked':''}" onclick="ekToggleFixItem(${it.id})"></div>
        <input class="ek-item-edit" id="ek-edit-${it.id}" value="${it.text.replace(/"/g,'&quot;')}"
          placeholder="Artikelname"
          onkeydown="if(event.key==='Enter')ekSaveEdit(${it.id},'fix');if(event.key==='Escape')ekCancelEdit();"
          onblur="ekSaveEdit(${it.id},'fix')" style="flex:1;">
        <button class="ek-del-btn" onclick="ekDeleteFixItem(${it.id})">×</button>
      </div>
      <div class="ek-extra-fields" style="padding-left:40px;">
        <input class="ek-extra-input" id="ek-edit-menge-${it.id}" value="${(it.menge||'').replace(/"/g,'&quot;')}" placeholder="Menge (z.B. 2 Stück)"
          onblur="ekSaveMengeEdit(${it.id})">
        <input class="ek-extra-input" id="ek-edit-min-${it.id}" value="${(it.mindeststand||'').replace(/"/g,'&quot;')}" placeholder="Mindeststand (z.B. 1)"
          onblur="ekSaveMinEdit(${it.id})">
      </div>
    </div>`;
  }
  return `<div class="ek-item" style="${metaRow?'align-items:flex-start;padding:12px 16px;':''}" onclick="ekStartEdit(${it.id})">
    <div class="ek-cb${it.erledigt?' checked':''}" onclick="event.stopPropagation();ekToggleFixItem(${it.id})" style="${metaRow?'margin-top:2px;':''}"></div>
    <div class="item-body" style="flex:1;">
      <div class="ek-item-text${it.erledigt?' done':''}">${it.text}</div>
      ${metaRow}
    </div>
    <button class="ek-del-btn" onclick="event.stopPropagation();ekDeleteFixItem(${it.id})">×</button>
  </div>`;
}

async function ekAddFixItem() {
  const inp = document.getElementById('ek-neu-input');
  const text = inp.value.trim(); if(!text) return;
  const menge = (document.getElementById('ek-neu-menge')?.value||'').trim();
  const mindeststand = (document.getElementById('ek-neu-min')?.value||'').trim();
  inp.value='';
  if(document.getElementById('ek-neu-menge')) document.getElementById('ek-neu-menge').value='';
  if(document.getElementById('ek-neu-min')) document.getElementById('ek-neu-min').value='';
  const tmp = {id:'tmp-'+Date.now(), text, menge, mindeststand, erledigt:false, listen_id:ekAktiveListeId, reihenfolge:0};
  if(!ekItems[ekAktiveListeId]) ekItems[ekAktiveListeId]=[];
  ekItems[ekAktiveListeId].unshift(tmp);
  ekRender();
  try {
    const res = await ekSbFetch('einkauf_items',{method:'POST',body:JSON.stringify({text,menge:menge||null,mindeststand:mindeststand||null,erledigt:false,listen_id:ekAktiveListeId,reihenfolge:0})});
    const saved=res[0];
    ekItems[ekAktiveListeId]=ekItems[ekAktiveListeId].map(i=>i.id===tmp.id?saved:i);
    ekRender();
  } catch(e) { ekItems[ekAktiveListeId]=ekItems[ekAktiveListeId].filter(i=>i.id!==tmp.id); ekRender(); showToast('⚠ Fehler'); }
}

async function ekSaveMengeEdit(id) {
  const inp = document.getElementById(`ek-edit-menge-${id}`); if(!inp) return;
  const menge = inp.value.trim();
  const it = ekItems[ekAktiveListeId]?.find(i=>i.id===id); if(!it) return;
  if(it.menge===menge) return;
  const old=it.menge; it.menge=menge;
  try { await ekSbFetch(`einkauf_items?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({menge:menge||null})}); }
  catch(e) { it.menge=old; showToast('⚠ Fehler'); }
}

async function ekSaveMinEdit(id) {
  const inp = document.getElementById(`ek-edit-min-${id}`); if(!inp) return;
  const mindeststand = inp.value.trim();
  const it = ekItems[ekAktiveListeId]?.find(i=>i.id===id); if(!it) return;
  if(it.mindeststand===mindeststand) return;
  const old=it.mindeststand; it.mindeststand=mindeststand;
  try { await ekSbFetch(`einkauf_items?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({mindeststand:mindeststand||null})}); }
  catch(e) { it.mindeststand=old; showToast('⚠ Fehler'); }
}

async function ekToggleFixItem(id) {
  const it=ekItems[ekAktiveListeId].find(i=>i.id===id); if(!it) return;
  const prev=it.erledigt; it.erledigt=!prev; ekRender();
  try { await ekSbFetch(`einkauf_items?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({erledigt:!prev})}); }
  catch(e) { it.erledigt=prev; ekRender(); showToast('⚠ Fehler'); }
}

async function ekDeleteFixItem(id) {
  const liste=ekItems[ekAktiveListeId];
  const idx=liste.findIndex(i=>i.id===id); if(idx===-1) return;
  const [removed]=liste.splice(idx,1); ekRender();
  try { await ekSbFetch(`einkauf_items?id=eq.${id}`,{method:'DELETE',prefer:''}); showToast('Entfernt'); }
  catch(e) { liste.splice(idx,0,removed); ekRender(); showToast('⚠ Fehler'); }
}

async function ekEinkaufErledigt() {
  // Alle Häkchen aller Kategorien zurücksetzen
  const allIds = [];
  Object.values(ekItems).forEach(items => items.forEach(it => { if(it.erledigt) allIds.push(it.id); it.erledigt=false; }));
  ekRender();
  if(allIds.length===0) { showToast('Nichts zum Zurücksetzen'); return; }
  try {
    await ekSbFetch(`einkauf_items?id=in.(${allIds.join(',')})`,{method:'PATCH',body:JSON.stringify({erledigt:false})});
    showToast('✓ Einkauf erledigt – Liste zurückgesetzt');
  } catch(e) { showToast('⚠ Fehler beim Zurücksetzen'); }
}

// ── FLEXIBLER EINKAUF (spontane Zusatzartikel) ──────────────────────────────
let ekFlexItems = [];



function ekRenderFlexItem(it) {
  if (ekEditItemId===it.id) {
    return `<div class="ek-item">
      <div class="ek-cb${it.erledigt?' checked':''}" onclick="ekToggleFlexItem(${it.id})"></div>

        onkeydown="if(event.key==='Enter')ekSaveEdit(${it.id},'flex');if(event.key==='Escape')ekCancelEdit();"
        onblur="ekSaveEdit(${it.id},'flex')">
      <button class="ek-del-btn" onclick="ekDeleteFlexItem(${it.id})">×</button>
    </div>`;
  }
  return `<div class="ek-item">
    <div class="ek-cb${it.erledigt?' checked':''}" onclick="ekToggleFlexItem(${it.id})"></div>
    <div class="ek-item-text${it.erledigt?' done':''}" ondblclick="ekStartEdit(${it.id})">${it.text}</div>
    <button class="ek-del-btn" onclick="ekDeleteFlexItem(${it.id})">×</button>
  </div>`;
}

async function ekAddFlexItem() {
  const inp = document.getElementById('ek-flex-input');
  const text = inp.value.trim(); if(!text) return;
  inp.value='';
  const tmp = {id:'tmp-'+Date.now(), text, erledigt:false, reihenfolge:ekFlexItems.length};
  ekFlexItems.unshift(tmp);
  ekRender();
  try {
    const res = await ekSbFetch('einkauf_flex',{method:'POST',body:JSON.stringify({text,erledigt:false,reihenfolge:0})});
    const saved=res[0];
    ekFlexItems=ekFlexItems.map(i=>i.id===tmp.id?saved:i);
    ekRender();
  } catch(e) { ekFlexItems=ekFlexItems.filter(i=>i.id!==tmp.id); ekRender(); showToast('⚠ Fehler'); }
}

async function ekToggleFlexItem(id) {
  const it=ekFlexItems.find(i=>i.id===id); if(!it) return;
  const prev=it.erledigt; it.erledigt=!prev; ekRender();
  try { await ekSbFetch(`einkauf_flex?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({erledigt:!prev})}); }
  catch(e) { it.erledigt=prev; ekRender(); showToast('⚠ Fehler'); }
}

async function ekDeleteFlexItem(id) {
  const idx=ekFlexItems.findIndex(i=>i.id===id); if(idx===-1) return;
  const [removed]=ekFlexItems.splice(idx,1); ekRender();
  try { await ekSbFetch(`einkauf_flex?id=eq.${id}`,{method:'DELETE',prefer:''}); showToast('Entfernt'); }
  catch(e) { ekFlexItems.splice(idx,0,removed); ekRender(); showToast('⚠ Fehler'); }
}

async function ekFlexErledigteLoeschen() {
  const done=ekFlexItems.filter(i=>i.erledigt); if(!done.length) return;
  ekFlexItems=ekFlexItems.filter(i=>!i.erledigt); ekRender();
  try { const ids=done.map(i=>i.id).join(','); await ekSbFetch(`einkauf_flex?id=in.(${ids})`,{method:'DELETE',prefer:''}); showToast(`${done.length} entfernt`); }
  catch(e) { ekFlexItems.push(...done); ekRender(); showToast('⚠ Fehler'); }
}

async function ekFlexAlleLoeschen() {
  const all=[...ekFlexItems]; ekFlexItems=[]; ekRender();
  try { await ekSbFetch(`einkauf_flex?id=in.(${all.map(i=>i.id).join(',')})`,{method:'DELETE',prefer:''}); showToast('Liste geleert'); }
  catch(e) { ekFlexItems=all; ekRender(); showToast('⚠ Fehler'); }
}

// ── GEMEINSAM ────────────────────────────────────────────────────────────────

function ekRender() {
  const mc = document.getElementById('einkauf-content');
  if(!mc) return;

  // Modus-Tabs oben
  const modusHtml = `<div class="ek-modus-tabs">
    <button class="ek-modus-tab${ekModus==='fix'?' active':''}" onclick="ekSetModus('fix')">📋 Fixer Einkauf</button>
    <button class="ek-modus-tab${ekModus==='flex'?' active':''}" onclick="ekSetModus('flex')">✨ Flexibler Einkauf</button>
  </div>`;

  mc.innerHTML = modusHtml + '<div id="ek-sub-content"></div>';
  if(ekModus==='fix') ekRenderFix(); else ekRenderFlex();
}

// Überschreibe Sub-Content statt gesamt
const _ekRenderFix = ekRenderFix;
const _ekRenderFlex = ekRenderFlex;

function ekRenderFix() {
  // Inject into sub-content if modus tabs already rendered
  const sub = document.getElementById('ek-sub-content');
  const mc = sub || document.getElementById('einkauf-content');
  if(!mc) return;

  if(!ekListen.length) { mc.innerHTML=`<div class="loading">⚠️ Fehler: Tabellen fehlen in Supabase.</div>`; return; }

  let tabsHtml = ekListen.map(l => {
    const itms = ekItems[l.id]||[];
    const offen = itms.filter(i=>!i.erledigt).length;
    const total = itms.length;
    const active = l.id===ekAktiveListeId?' active':'';
    const badge = total>0 ? `<span class="ek-badge">${offen}/${total}</span>` : '';
    return `<button class="ek-listen-tab${active}" onclick="ekSwitchListe(${l.id})">${l.name}${badge}</button>`;
  }).join('');
  tabsHtml = `<button class="ek-listen-tab${ekAktiveListeId==='notiz'?' active':''}" onclick="ekZeigeNotiz()" style="flex-shrink:0;">🎤 Notiz</button>` + tabsHtml;
  tabsHtml += `<button class="ek-add-list-btn" onclick="ekOpenModalNeueListe()">+ Liste</button>`;

  const aktive = ekListen.find(l=>l.id===ekAktiveListeId);
  if (!aktive) { mc.innerHTML=''; return; }

  const listeItems = ekItems[ekAktiveListeId]||[];
  const offenItems = listeItems.filter(i=>!i.erledigt);
  const erledigtItems = listeItems.filter(i=>i.erledigt);
  const done = erledigtItems.length, total = listeItems.length;

  const listActions = `<div class="ek-list-actions">
    <button class="ek-list-action-btn" onclick="ekStartRename(${aktive.id}, this)">✏️ Umbenennen</button>
    <button class="ek-list-action-btn red" onclick="ekBestaetigenLoeschen(${aktive.id})">🗑 Löschen</button>
  </div>
  <div id="ek-rename-box" style="display:none;background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;">
    <div style="font-size:13px;color:#8E8E93;margin-bottom:8px;">Liste umbenennen</div>
    <div style="display:flex;gap:8px;">
      <input id="ek-rename-input" style="flex:1;border:1px solid #E5E5EA;border-radius:10px;padding:10px 12px;font-size:15px;outline:none;min-width:0;" type="text">
      <button onclick="ekSaveRename(${aktive.id})" style="background:#1C1C1E;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;">OK</button>
      <button onclick="ekHideRename()" style="background:#E5E5EA;color:#1C1C1E;border:none;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;flex-shrink:0;">×</button>
    </div>
  </div>
  <div id="ek-delete-box" style="display:none;background:#FFF0EE;border-radius:12px;padding:14px;margin-bottom:12px;">
    <div style="font-size:14px;font-weight:600;color:#FF3B30;margin-bottom:10px;">„${aktive.name}" wirklich löschen?</div>
    <div style="display:flex;gap:8px;">
      <button id="ek-delete-ok" style="flex:1;background:#FF3B30;color:#fff;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;">Ja, löschen</button>
      <button onclick="ekHideDelete()" style="flex:1;background:#E5E5EA;color:#1C1C1E;border:none;border-radius:10px;padding:10px;font-size:14px;cursor:pointer;">Abbrechen</button>
    </div>
  </div>`;

  const statsHtml = total>0 ? `<div class="ek-stats-row">
    <span class="ek-stats-text">${done} von ${total} erledigt</span>
  </div>` : '';

  let itemsHtml = '';
  if (listeItems.length===0) {
    itemsHtml = `<div class="empty-state"><div style="font-size:36px;margin-bottom:8px">📋</div>Noch keine Pflichtartikel.<br>Füge Stammprodukte hinzu.</div>`;
  } else {
    if (offenItems.length>0) itemsHtml += `<div class="checklist-card">${offenItems.map(it=>ekRenderFixItem(it)).join('')}</div>`;
    if (erledigtItems.length>0) itemsHtml += `<div class="ek-done-label">Erledigt</div><div class="checklist-card">${erledigtItems.map(it=>ekRenderFixItem(it)).join('')}</div>`;
  }

  const allDone = total>0 && done===total;
  const erledigtBtn = total>0 ? `<div style="padding:16px 0 8px;">
    <button class="ek-erledigt-btn${allDone?' ready':''}" onclick="ekEinkaufErledigt()">
      ${allDone ? '🎉 Einkauf erledigt – Häkchen zurücksetzen' : '✓ Einkauf erledigt'}
    </button>
  </div>` : '';

  mc.innerHTML = `
    <div class="ek-listen-tabs">${tabsHtml}</div>
    ${listActions}
    <div class="ek-input-card" style="flex-direction:column;gap:8px;">
      <div style="display:flex;gap:8px;">
        <input class="ek-eingabe" id="ek-neu-input" placeholder="Pflichtartikel hinzufügen…" type="text" onkeydown="if(event.key==='Enter')ekAddFixItem()">
        <button class="ek-add-btn" onclick="ekAddFixItem()">+</button>
      </div>
      <div class="ek-extra-fields">
        <input class="ek-extra-input" id="ek-neu-menge" placeholder="🛒 Menge (z.B. 2 Stück)" type="text" onkeydown="if(event.key==='Enter')ekAddFixItem()">
        <input class="ek-extra-input" id="ek-neu-min" placeholder="⚠ Mindeststand (z.B. 1)" type="text" onkeydown="if(event.key==='Enter')ekAddFixItem()">
      </div>
    </div>
    ${statsHtml}${itemsHtml}${erledigtBtn}`;
}

function ekRenderFlex() {
  const sub = document.getElementById('ek-sub-content');
  const mc = sub || document.getElementById('einkauf-content');
  if(!mc) return;

  const offenItems = ekFlexItems.filter(i=>!i.erledigt);
  const erledigtItems = ekFlexItems.filter(i=>i.erledigt);
  const done = erledigtItems.length, total = ekFlexItems.length;

  let itemsHtml = '';
  if (ekFlexItems.length===0) {
    itemsHtml = `<div class="empty-state"><div style="font-size:36px;margin-bottom:8px">✨</div>Keine Zusatzartikel.<br>Füge spontane Einkäufe hinzu.</div>`;
  } else {
    if (offenItems.length>0) itemsHtml += `<div class="checklist-card">${offenItems.map(it=>ekRenderFlexItem(it)).join('')}</div>`;
    if (erledigtItems.length>0) itemsHtml += `<div class="ek-done-label">Erledigt</div><div class="checklist-card">${erledigtItems.map(it=>ekRenderFlexItem(it)).join('')}</div>`;
  }

  const statsHtml = total>0 ? `<div class="ek-stats-row">
    <span class="ek-stats-text">${done} von ${total} erledigt</span>
    ${done>0 ? `<button class="ek-clear-btn" onclick="ekFlexErledigteLoeschen()">Erledigte entfernen</button>` : ''}
  </div>` : '';

  const alleBtn = total>0 ? `<div style="padding:16px 0 8px;">
    <button class="ek-erledigt-btn" onclick="ekFlexAlleLoeschen()">🗑 Alle löschen</button>
  </div>` : '';

  mc.innerHTML = `
    <div class="ek-input-card">
      <input class="ek-eingabe" id="ek-flex-input" placeholder="Zusatzartikel hinzufügen…" type="text" onkeydown="if(event.key==='Enter')ekAddFlexItem()">
      <button class="ek-add-btn" onclick="ekAddFlexItem()">+</button>
    </div>
    ${statsHtml}${itemsHtml}${alleBtn}`;
}

function ekSetModus(m) { ekModus=m; ekRender(); }
function ekSwitchListe(id) { ekAktiveListeId=id; ekEditItemId=null; ekRenderFix(); }

function ekStartEdit(id) { ekEditItemId=id; ekRender(); setTimeout(()=>document.getElementById(`ek-edit-${id}`)?.focus(),50); }
async function ekSaveEdit(id, typ) {
  if(ekEditItemId!==id) return;
  const inp=document.getElementById(`ek-edit-${id}`); if(!inp) return;
  const text=inp.value.trim(); ekEditItemId=null;
  if(!text) { ekRender(); return; }
  if(typ==='fix') {
    const it=ekItems[ekAktiveListeId]?.find(i=>i.id===id); if(!it){ekRender();return;}
    const mengeInp = document.getElementById(`ek-edit-menge-${id}`);
    const minInp = document.getElementById(`ek-edit-min-${id}`);
    const menge = mengeInp ? mengeInp.value.trim() : it.menge;
    const mindeststand = minInp ? minInp.value.trim() : it.mindeststand;
    if(it.text===text && it.menge===(menge||null||'') && it.mindeststand===(mindeststand||null||'')){ekRender();return;}
    const oldText=it.text, oldMenge=it.menge, oldMin=it.mindeststand;
    it.text=text; it.menge=menge||null; it.mindeststand=mindeststand||null; ekRender();
    try { await ekSbFetch(`einkauf_items?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({text,menge:menge||null,mindeststand:mindeststand||null})}); showToast('✓ Gespeichert'); }
    catch(e) { it.text=oldText; it.menge=oldMenge; it.mindeststand=oldMin; ekRender(); showToast('⚠ Fehler'); }
  } else {
    const it=ekFlexItems.find(i=>i.id===id); if(!it||it.text===text){ekRender();return;}
    const old=it.text; it.text=text; ekRender();
    try { await ekSbFetch(`einkauf_flex?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({text})}); }
    catch(e) { it.text=old; ekRender(); showToast('⚠ Fehler'); }
  }
}
function ekCancelEdit() { ekEditItemId=null; ekRender(); }


// ── LISTE VERWALTEN (inline, kein Modal) ─────────────────────────────────────
function ekStartRename(id) {
  const l = ekListen.find(l=>l.id===id); if(!l) return;
  const box = document.getElementById('ek-rename-box');
  const inp = document.getElementById('ek-rename-input');
  if(!box||!inp) return;
  const dbox = document.getElementById('ek-delete-box');
  if(dbox) dbox.style.display='none';
  box.style.display='block';
  inp.value = l.name;
  setTimeout(()=>{ inp.focus(); inp.select(); }, 80);
}
function ekHideRename() {
  const b = document.getElementById('ek-rename-box'); if(b) b.style.display='none';
}
async function ekSaveRename(id) {
  const inp = document.getElementById('ek-rename-input'); if(!inp) return;
  const name = inp.value.trim(); if(!name) return;
  ekHideRename();
  const l = ekListen.find(l=>l.id===id); if(!l) return;
  const old = l.name; l.name=name; ekRender();
  try { await ekSbFetch(`einkauf_listen?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({name})}); showToast('✓ Umbenannt'); }
  catch(e) { l.name=old; ekRender(); showToast('⚠ Fehler'); }
}
function ekBestaetigenLoeschen(id) {
  const box = document.getElementById('ek-delete-box');
  const btn = document.getElementById('ek-delete-ok');
  if(!box||!btn) return;
  const rb = document.getElementById('ek-rename-box'); if(rb) rb.style.display='none';
  box.style.display='block';
  btn.onclick = ()=>ekListeLoeschen(id);
}
function ekHideDelete() {
  const b = document.getElementById('ek-delete-box'); if(b) b.style.display='none';
}
function ekOpenModalNeueListe() {
  const name = prompt('Name der neuen Liste:');
  if(!name||!name.trim()) return;
  ekSpeicherNeueListe(name.trim());
}
async function ekSpeicherNeueListe(name) {
  try {
    const res=await ekSbFetch('einkauf_listen',{method:'POST',body:JSON.stringify({name,reihenfolge:ekListen.length})});
    const neu=res[0]; ekListen.push(neu); ekItems[neu.id]=[]; ekAktiveListeId=neu.id; ekRender(); showToast(`✓ ${name} erstellt`);
  } catch(e) { showToast('⚠ Fehler'); }
}
function ekCloseModalListe() {}
function ekCloseModalDelete() {}
async function ekListeLoeschen(id) {
  ekHideDelete();
  const idx=ekListen.findIndex(l=>l.id===id); if(idx===-1) return;
  const [removed]=ekListen.splice(idx,1);
  const removedItems=ekItems[id]||[]; delete ekItems[id];
  if(ekAktiveListeId===id) ekAktiveListeId=ekListen[0]?.id||null;
  ekRender();
  try {
    await ekSbFetch(`einkauf_items?listen_id=eq.${id}`,{method:'DELETE',prefer:''});
    await ekSbFetch(`einkauf_listen?id=eq.${id}`,{method:'DELETE',prefer:''});
    showToast('Liste gelöscht');
  } catch(e) { ekListen.splice(idx,0,removed); ekItems[id]=removedItems; ekAktiveListeId=id; ekRender(); showToast('⚠ Fehler'); }
}

function showEinkauf() {
  setTab('einkauf');

<script>
// ── Notiz-Tab ──
var ekNotizItems = JSON.parse(localStorage.getItem('ek-notiz') || '[]');

function ekSaveNotiz() {
  localStorage.setItem('ek-notiz', JSON.stringify(ekNotizItems));
}

function ekZeigeNotiz() {
  ekAktiveListeId = 'notiz';
  const mc = document.getElementById('einkauf-content');
  if (!mc) return;
  ekRenderNotiz(mc);
}

function ekRenderNotiz(mc) {
  const items = ekNotizItems;
  const itemsHtml = items.length === 0
    ? '<div class="empty-state"><div style="font-size:36px;margin-bottom:8px">🎤</div>Noch keine Notizen.<br>Sprich oder tippe etwas ein.</div>'
    : items.map((it, i) => `
        <div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #F2F2F7;">
          <input type="checkbox" ${it.done?'checked':''} onchange="ekNotizToggle(${i})" style="width:20px;height:20px;cursor:pointer;accent-color:#1C1C1E;">
          <span style="flex:1;font-size:15px;${it.done?'text-decoration:line-through;color:#8E8E93;':'color:#1C1C1E;'}">${it.text}</span>
          <button onclick="ekNotizDelete(${i})" style="background:none;border:none;font-size:18px;cursor:pointer;color:#C0392B;">×</button>
        </div>`).join('');

  mc.innerHTML = `
    <div class="ek-listen-tabs">
      ${ekListen.map(l => {
        const active = l.id===ekAktiveListeId?' active':'';
        return '<button class="ek-listen-tab'+active+'" onclick="ekSwitchListe('+l.id+')">'+l.name+'</button>';
      }).join('')}
      <button class="ek-listen-tab active" style="flex-shrink:0;">🎤 Notiz</button>
      <button class="ek-add-list-btn" onclick="ekOpenModalNeueListe()">+ Liste</button>
    </div>
    <div style="background:#fff;border-radius:12px;padding:12px;margin-bottom:16px;display:flex;gap:8px;">
      <input id="ek-notiz-input" placeholder="Notiz eingeben…" type="text"
        style="flex:1;border:1px solid #E5E5EA;border-radius:10px;padding:10px 12px;font-size:15px;outline:none;min-width:0;"
        onkeydown="if(event.key==='Enter')ekNotizAdd()">
      <button onclick="ekNotizMikro()" id="ek-notiz-mikro-btn"
        style="background:#F2F2F7;border:none;border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer;flex-shrink:0;">🎤</button>
      <button onclick="ekNotizAdd()"
        style="background:#1C1C1E;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;">+</button>
    </div>
    <div class="checklist-card" style="${items.length?'':'border:none;background:none;box-shadow:none;'}">${itemsHtml}</div>
    ${items.some(i=>i.done) ? '<div style="padding:8px 0;"><button onclick="ekNotizClearDone()" style="background:#FFE5E5;color:#C0392B;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%;">✓ Erledigte löschen</button></div>' : ''}
  `;
}

function ekNotizAdd() {
  var input = document.getElementById('ek-notiz-input');
  if (!input || !input.value.trim()) return;
  ekNotizItems.push({text: input.value.trim(), done: false});
  ekSaveNotiz();
  input.value = '';
  ekRenderNotiz(document.getElementById('einkauf-content'));
}

function ekNotizToggle(i) {
  ekNotizItems[i].done = !ekNotizItems[i].done;
  ekSaveNotiz();
  ekRenderNotiz(document.getElementById('einkauf-content'));
}

function ekNotizDelete(i) {
  ekNotizItems.splice(i, 1);
  ekSaveNotiz();
  ekRenderNotiz(document.getElementById('einkauf-content'));
}

function ekNotizClearDone() {
  ekNotizItems = ekNotizItems.filter(i => !i.done);
  ekSaveNotiz();
  ekRenderNotiz(document.getElementById('einkauf-content'));
}

function ekNotizMikro() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Mikrofon nicht verfügbar'); return; }
  var btn = document.getElementById('ek-notiz-mikro-btn');
  btn.textContent = '🔴';
  btn.style.background = '#FFE5E5';
  var erk = new SR();
  erk.lang = 'de-AT';
  erk.continuous = false;
  erk.interimResults = false;
  erk.onresult = function(e) {
    var text = e.results[0][0].transcript;
    ekNotizItems.push({text: text, done: false});
    ekSaveNotiz();
    btn.textContent = '🎤';
    btn.style.background = '#F2F2F7';
    ekRenderNotiz(document.getElementById('einkauf-content'));
  };
  erk.onend = function() {
    btn.textContent = '🎤';
    btn.style.background = '#F2F2F7';
  };
  erk.onerror = function() {
    btn.textContent = '🎤';
    btn.style.background = '#F2F2F7';
  };
  erk.start();
}
</script>
