let checksHeute = {};
let checksGestern = {};

async function sbFetch(path, opts={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': opts.prefer||'return=representation', ...opts.headers },
    ...opts
  });
  const text = await res.text();
  if(!res.ok) throw new Error(text);
  return text ? JSON.parse(text) : [];
}

async function ladeAlles() {
  try {
    const zuw = await sbFetch(`salon_monatszuweisung?monat=eq.${MONAT_STR}&select=bereich,person`);
    zuweisung = {};
    zuw.forEach(z => { zuweisung[z.bereich] = z.person; });

    const ch = await sbFetch(`salon_checks?datum=eq.${HEUTE_STR}&select=bereich,tageszeit,aufgabe_index,person,uhrzeit`);
    checksHeute = {};
    ch.forEach(c => { checksHeute[`${c.bereich}-${c.tageszeit}-${c.aufgabe_index}`] = {person:c.person,uhrzeit:c.uhrzeit}; });

    const cg = await sbFetch(`salon_checks?datum=eq.${GESTERN_STR}&select=bereich,tageszeit,aufgabe_index,erledigt`);

function getTotalUndDone(bereichKey) {
  const b = BEREICHE[bereichKey];
  let total = 0, done = 0;
  // Nur morgens, untertags, abends (nicht wöchentlich) für Tagesfortschritt
  const tzKeys = HEUTE.getDay() === 0 || HEUTE.getDay() === 6 ? ['morgens','untertags','abends','woechentlich'] : ['morgens','untertags','abends'];
  tzKeys.forEach(tz => {
    (b.aufgaben[tz]||[]).forEach((_,i) => {
      total++;
      if(checksHeute[`${bereichKey}-${tz}-${i}`]) done++;
    });
  });
  return {total, done};
}

function renderMain() {

  Object.entries(BEREICHE).forEach(([key,b]) => {

    const fc = pct===100?'done':pct>0?'partial':'empty';
    const person = zuweisung[key]||'–';

    // Mini-Zeilen für Morgens / Untertags / Abends
    const tzMini = ['morgens','untertags','abends'].map(tzKey => {
      const tzLabel = tzKey==='morgens'?'Morgens':tzKey==='untertags'?'Untertags':'Abends';

      const tzDone = aufgaben.filter((_,i)=>checksHeute[`${key}-${tzKey}-${i}`]).length;
      const tzTotal = aufgaben.length;

function renderTzTabs() {
  const key = currentDetailBereich;
  const b = BEREICHE[key];
  let html = '';
  TAGESZEITEN.forEach(tz => {
    const aufgaben = b.aufgaben[tz.key]||[];
    const done = aufgaben.filter((_,i)=>checksHeute[`${key}-${tz.key}-${i}`]).length;
    const active = tz.key === currentTageszeit ? ' active' : '';
    html += `<button class="tz-tab${active}" onclick="switchTz('${tz.key}')">
      ${tz.icon} ${tz.label}<span class="tz-count">${done}/${aufgaben.length}</span>
    </button>`;
  });
  document.getElementById('tz-tabs').innerHTML = html;
}

function switchTz(tz) {
  currentTageszeit = tz;
  renderTzTabs();
  renderDetail();
}

function renderDetail() {
  const key = currentDetailBereich;
  const tz = currentTageszeit;
  const aufgaben = BEREICHE[key].aufgaben[tz]||[];

  const hatGestern = aufgaben.some((_,i)=>checksGestern[`${key}-${tz}-${i}`]);
  const vortagOffen = hatGestern ? aufgaben.filter((_,i)=>!checksGestern[`${key}-${tz}-${i}`]&&!checksHeute[`${key}-${tz}-${i}`]).length : 0;
  let banner = vortagOffen > 0 ? `<div class="vortag-banner">⚠ ${vortagOffen} Punkt${vortagOffen>1?'e':''} von gestern noch offen</div>` : '';

  if(aufgaben.length === 0) {
    document.getElementById('detail-content').innerHTML = `<div class="empty-state">Keine Aufgaben für diesen Zeitraum</div>`;
    return;
  }

  let items = '';
  aufgaben.forEach((aufgabe,i) => {
    const k = `${key}-${tz}-${i}`;
    const check = checksHeute[k];
    const done = !!check;
    const vortag = hatGestern && !checksGestern[k] && !done;
    items += `
      <div class="check-item${vortag?' vortag':''}" onclick="toggleItem('${key}','${tz}',${i})">
        <div class="cb${done?' checked':''}"></div>
        <div class="item-body">
          <div class="item-label${done?' done':''}">${vortag?'<span class="vortag-dot"></span>':''}${aufgabe}</div>
          ${done?`<div class="item-meta">${check.person} · ${check.uhrzeit}</div>`:''}
        </div>
      </div>`;
  });

  document.getElementById('detail-content').innerHTML = `${banner}<div class="checklist-card">${items}</div>`;
}

}

function toggleItem(bereich, tz, index) {
  const k = `${bereich}-${tz}-${index}`;

async function selectName(name) {
  document.getElementById('modal').classList.remove('open');
  const bereich = pendingBereich, tz = pendingTageszeit, index = pendingIndex;
  const k = `${bereich}-${tz}-${index}`;
  const now = new Date();
  const uhrzeit = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  checksHeute[k] = {person:name,uhrzeit};
  renderDetail(); renderTzTabs();

    await sbFetch('salon_checks',{method:'POST',prefer:'resolution=merge-duplicates',body:JSON.stringify({datum:HEUTE_STR,bereich,tageszeit:tz,aufgabe_index:index,person:name,uhrzeit,erledigt:true})});

async function uncheckeItem(bereich,tz,index) {
  const k = `${bereich}-${tz}-${index}`, prev = checksHeute[k];

  try { await sbFetch(`salon_checks?datum=eq.${HEUTE_STR}&bereich=eq.${bereich}&tageszeit=eq.${tz}&aufgabe_index=eq.${index}`,{method:'DELETE',prefer:''}); }

// REALTIME
function startRealtime() {
  const wsUrl = SUPABASE_URL.replace('https://','wss://')+'/realtime/v1/websocket?apikey='+SUPABASE_KEY+'&vsn=1.0.0';
  let ws, hb;
  function connect() {
    try { ws = new WebSocket(wsUrl); } catch(e) { setTimeout(connect,5000); return; }
    ws.onopen = () => {
      ws.send(JSON.stringify({topic:'realtime:public:salon_checks',event:'phx_join',payload:{config:{broadcast:{self:false},postgres_changes:[{event:'*',schema:'public',table:'salon_checks'}]}},ref:'1'}));
      ws.send(JSON.stringify({topic:'realtime:public:salon_monatszuweisung',event:'phx_join',payload:{config:{broadcast:{self:false},postgres_changes:[{event:'*',schema:'public',table:'salon_monatszuweisung'}]}},ref:'2'}));
      hb = setInterval(()=>{ if(ws.readyState===1) ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'hb'})); },25000);
      zeigeSyncStatus(true);
    };
    ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if(msg.event==='postgres_changes') {
          const d = msg.payload?.data;
          if(!d) return;
          // Checks
          if(d.type==='INSERT'||d.type==='UPDATE') {
            const r = d.record;
            if(r.datum===HEUTE_STR) {
              const k = `${r.bereich}-${r.tageszeit}-${r.aufgabe_index}`;
              if(r.erledigt) checksHeute[k]={person:r.person,uhrzeit:r.uhrzeit};
              else delete checksHeute[k];
            }
            // Zuweisung
            if(r.monat) { zuweisung[r.bereich]=r.person; }
          } else if(d.type==='DELETE') {
            const r = d.old_record;
            if(r&&r.datum===HEUTE_STR) delete checksHeute[`${r.bereich}-${r.tageszeit}-${r.aufgabe_index}`];
          }
          if(currentDetailBereich) { renderDetail(); renderTzTabs(); }
          renderMain();
        }
      } catch(e) {}
    };
    ws.onclose = () => { clearInterval(hb); zeigeSyncStatus(false); setTimeout(connect,3000); };
    ws.onerror = () => zeigeSyncStatus(false);
  }
  connect();
}

function zeigeSyncStatus(online) {
  const dot = document.getElementById('sync-dot');
  if(dot) dot.style.background = online?'#34C759':'#FF9500';
}

async function ekSbFetch(path, opts={}) {
  const res = await fetch(`${GHD_URL2}/rest/v1/${path}`, {
    headers: { 'apikey': GHD_KEY2, 'Authorization': `Bearer ${GHD_KEY2}`, 'Content-Type': 'application/json', 'Prefer': opts.prefer||'return=representation', ...opts.headers },
    ...opts
  });
  const text = await res.text();
  if (!res.ok) throw new Error(text);

async function ekLadeAlles() {
  try {
    const l = await ekSbFetch('einkauf_listen?order=reihenfolge.asc');
    if (l.length === 0) {
      const defaults = ['Supermarkt','Drogerie','Großhandel'];
      for (let i = 0; i < defaults.length; i++) {
        const neu = await ekSbFetch('einkauf_listen', { method:'POST', body:JSON.stringify({name:defaults[i],reihenfolge:i}) });
        ekListen.push(neu[0]);
      }
    } else {
      ekListen = l;
    }
    const allItems = await ekSbFetch('einkauf_items?order=reihenfolge.asc');
    ekItems = {};
    ekListen.forEach(l => ekItems[l.id] = []);
    allItems.forEach(it => { if (ekItems[it.listen_id]) ekItems[it.listen_id].push(it); });
    if (!ekAktiveListeId && ekListen.length > 0) ekAktiveListeId = ekListen[0].id;
    ekRender();
  } catch(e) {
    document.getElementById('einkauf-content').innerHTML = `<div class="loading">⚠️ Fehler: ${e.message}</div>`;
  }
}

function ekRender() {
  const mc = document.getElementById('einkauf-content');
  if (!ekListen.length) { mc.innerHTML = `<div class="empty-state"><div style="font-size:36px;margin-bottom:8px">🛒</div>Noch keine Listen.</div>`; return; }

  let tabsHtml = ekListen.map(l => {
    const itms = ekItems[l.id]||[];
    const offen = itms.filter(i=>!i.erledigt).length;
    const active = l.id===ekAktiveListeId?' active':'';
    return `<button class="ek-listen-tab${active}" onclick="ekSwitchListe(${l.id})">${l.name}${offen>0?`<span class="ek-badge">${offen}</span>`:''}</button>`;
  }).join('');
  tabsHtml += `<button class="ek-add-list-btn" onclick="ekOpenModalNeueListe()">+ Liste</button>`;

  const aktive = ekListen.find(l=>l.id===ekAktiveListeId);
  if (!aktive) { ekAktiveListeId=ekListen[0].id; ekRender(); return; }

  const listeItems = ekItems[ekAktiveListeId]||[];
  const offenItems = listeItems.filter(i=>!i.erledigt);
  const erledigtItems = listeItems.filter(i=>i.erledigt);
  const done = erledigtItems.length, total = listeItems.length;

  const listActions = `<div class="ek-list-actions">
    <button class="ek-list-action-btn" onclick="ekOpenModalUmbenennen(${aktive.id},'${aktive.name.replace(/'/g,"\\'")}')">✏️ Umbenennen</button>
    <button class="ek-list-action-btn red" onclick="ekOpenModalDelete(${aktive.id},'${aktive.name.replace(/'/g,"\\'")}')">🗑 Löschen</button>
  </div>`;

  const statsHtml = total>0 ? `<div class="ek-stats-row">
    <span class="ek-stats-text">${done} von ${total} erledigt</span>
    ${done>0?`<button class="ek-clear-btn" onclick="ekErledigteLoeschen()">Erledigte entfernen</button>`:''}
  </div>` : '';

  let itemsHtml = '';
  if (offenItems.length===0 && erledigtItems.length===0) {
    itemsHtml = `<div class="empty-state"><div style="font-size:36px;margin-bottom:8px">✅</div>Liste ist leer.<br>Füge oben ein Produkt hinzu.</div>`;
  } else {
    if (offenItems.length>0) itemsHtml += `<div class="checklist-card">${offenItems.map(it=>ekRenderItem(it)).join('')}</div>`;
    if (erledigtItems.length>0) itemsHtml += `<div class="ek-done-label">Erledigt</div><div class="checklist-card">${erledigtItems.map(it=>ekRenderItem(it)).join('')}</div>`;
  }

  mc.innerHTML = `
    <div class="ek-listen-tabs">${tabsHtml}</div>
    ${listActions}
    <div class="ek-input-card">
      <input class="ek-eingabe" id="ek-neu-input" placeholder="Produkt hinzufügen…" type="text" onkeydown="if(event.key==='Enter')ekAddItem()">
      <button class="ek-add-btn" onclick="ekAddItem()">Hinzufügen</button>
    </div>
    ${statsHtml}${itemsHtml}`;
}

function ekRenderItem(it) {
  if (ekEditItemId===it.id) {
    return `<div class="ek-item">
      <div class="ek-cb${it.erledigt?' checked':''}" onclick="ekToggleItem(${it.id})"></div>
      <input class="ek-item-edit" id="ek-edit-${it.id}" value="${it.text.replace(/"/g,'&quot;')}"
        onkeydown="if(event.key==='Enter')ekSaveEdit(${it.id});if(event.key==='Escape')ekCancelEdit();"
        onblur="ekSaveEdit(${it.id})">
      <button class="ek-del-btn" onclick="ekDeleteItem(${it.id})">×</button>
    </div>`;
  }
  return `<div class="ek-item">
    <div class="ek-cb${it.erledigt?' checked':''}" onclick="ekToggleItem(${it.id})"></div>
    <div class="ek-item-text${it.erledigt?' done':''}" ondblclick="ekStartEdit(${it.id})">${it.text}</div>
    <button class="ek-del-btn" onclick="ekDeleteItem(${it.id})">×</button>
  </div>`;
}

function ekSwitchListe(id) { ekAktiveListeId=id; ekEditItemId=null; ekRender(); }

async function ekAddItem() {
  const inp = document.getElementById('ek-neu-input');
  const text = inp.value.trim(); if(!text) return;
  inp.value='';
  const tmp = {id:'tmp-'+Date.now(), text, erledigt:false, listen_id:ekAktiveListeId, reihenfolge:0};
  if(!ekItems[ekAktiveListeId]) ekItems[ekAktiveListeId]=[];
  ekItems[ekAktiveListeId].unshift(tmp);
  ekRender();
  document.getElementById('ek-neu-input')?.focus();
  try {
    const res = await ekSbFetch('einkauf_items',{method:'POST',body:JSON.stringify({text,erledigt:false,listen_id:ekAktiveListeId,reihenfolge:0})});
    const saved=res[0];
    ekItems[ekAktiveListeId]=ekItems[ekAktiveListeId].map(i=>i.id===tmp.id?saved:i);
    ekRender();
  } catch(e) { ekItems[ekAktiveListeId]=ekItems[ekAktiveListeId].filter(i=>i.id!==tmp.id); ekRender(); showToast('⚠ Fehler'); }
}

async function ekToggleItem(id) {
  const it=ekItems[ekAktiveListeId].find(i=>i.id===id); if(!it) return;
  const prev=it.erledigt; it.erledigt=!prev; ekRender();
  try { await ekSbFetch(`einkauf_items?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({erledigt:!prev})}); }
  catch(e) { it.erledigt=prev; ekRender(); showToast('⚠ Fehler'); }
}

function ekStartEdit(id) { ekEditItemId=id; ekRender(); setTimeout(()=>document.getElementById(`ek-edit-${id}`)?.focus(),50); }
async function ekSaveEdit(id) {
  if(ekEditItemId!==id) return;
  const inp=document.getElementById(`ek-edit-${id}`); if(!inp) return;
  const text=inp.value.trim(); ekEditItemId=null;
  if(!text) { ekRender(); return; }
  const it=ekItems[ekAktiveListeId].find(i=>i.id===id);
  if(!it||it.text===text) { ekRender(); return; }
  const old=it.text; it.text=text; ekRender();
  try { await ekSbFetch(`einkauf_items?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({text})}); }
  catch(e) { it.text=old; ekRender(); showToast('⚠ Fehler'); }
}
function ekCancelEdit() { ekEditItemId=null; ekRender(); }

async function ekDeleteItem(id) {
  const liste=ekItems[ekAktiveListeId];
  const idx=liste.findIndex(i=>i.id===id); if(idx===-1) return;
  const [removed]=liste.splice(idx,1); ekRender();
  try { await ekSbFetch(`einkauf_items?id=eq.${id}`,{method:'DELETE',prefer:''}); showToast('Entfernt'); }
  catch(e) { liste.splice(idx,0,removed); ekRender(); showToast('⚠ Fehler'); }
}

async function ekErledigteLoeschen() {
  const done=(ekItems[ekAktiveListeId]||[]).filter(i=>i.erledigt); if(!done.length) return;
  ekItems[ekAktiveListeId]=ekItems[ekAktiveListeId].filter(i=>!i.erledigt); ekRender();
  try { const ids=done.map(i=>i.id).join(','); await ekSbFetch(`einkauf_items?id=in.(${ids})`,{method:'DELETE',prefer:''}); showToast(`${done.length} entfernt`); }
  catch(e) { ekItems[ekAktiveListeId].push(...done); ekRender(); showToast('⚠ Fehler'); }
}

function ekOpenModalNeueListe() {
  ekModalListeEditId=null;
  document.getElementById('ek-modal-liste-titel').textContent='Neue Liste';
  document.getElementById('ek-modal-liste-input').value='';
  document.getElementById('ek-modal-liste-ok').textContent='Erstellen';
  document.getElementById('ek-modal-liste').classList.add('open');
  setTimeout(()=>document.getElementById('ek-modal-liste-input').focus(),100);
}
function ekOpenModalUmbenennen(id,name) {
  ekModalListeEditId=id;
  document.getElementById('ek-modal-liste-titel').textContent='Liste umbenennen';
  document.getElementById('ek-modal-liste-input').value=name;
  document.getElementById('ek-modal-liste-ok').textContent='Speichern';
  document.getElementById('ek-modal-liste').classList.add('open');
  setTimeout(()=>{ const inp=document.getElementById('ek-modal-liste-input'); inp.focus(); inp.select(); },100);
}
function ekCloseModalListe() { document.getElementById('ek-modal-liste').classList.remove('open'); }
async function ekSpeicherListe() {
  const name=document.getElementById('ek-modal-liste-input').value.trim(); if(!name) return;
  ekCloseModalListe();
  if(ekModalListeEditId) {
    const l=ekListen.find(l=>l.id===ekModalListeEditId); if(!l) return;
    const old=l.name; l.name=name; ekRender();
    try { await ekSbFetch(`einkauf_listen?id=eq.${ekModalListeEditId}`,{method:'PATCH',body:JSON.stringify({name})}); }
    catch(e) { l.name=old; ekRender(); showToast('⚠ Fehler'); }
  } else {
    try {
      const res=await ekSbFetch('einkauf_listen',{method:'POST',body:JSON.stringify({name,reihenfolge:ekListen.length})});
      const neu=res[0]; ekListen.push(neu); ekItems[neu.id]=[]; ekAktiveListeId=neu.id; ekRender(); showToast(`✓ ${name} erstellt`);
    } catch(e) { showToast('⚠ Fehler'); }
  }
}
function ekOpenModalDelete(id,name) {
  ekModalDeleteId=id;
  document.getElementById('ek-modal-delete-titel').textContent=`„${name}" löschen?`;
  document.getElementById('ek-modal-delete').classList.add('open');
}
function ekCloseModalDelete() { document.getElementById('ek-modal-delete').classList.remove('open'); }
async function ekListeLoeschen() {
  const id=ekModalDeleteId; ekCloseModalDelete();
  const idx=ekListen.findIndex(l=>l.id===id); if(idx===-1) return;
  const [removed]=ekListen.splice(idx,1);
  const removedItems=ekItems[id]||[]; delete ekItems[id];
  if(ekAktiveListeId===id) ekAktiveListeId=ekListen[0]?.id||null;
  ekRender();
  try {
    await ekSbFetch(`einkauf_items?listen_id=eq.${id}`,{method:'DELETE',prefer:''});
    await ekSbFetch(`einkauf_listen?id=eq.${id}`,{method:'DELETE',prefer:''});
    showToast('Liste gelöscht');
  } catch(e) { ekListen.splice(idx,0,removed); ekItems[id]=removedItems; ekAktiveListeId=id; ekRender(); showToast('⚠ Fehler'); }
}

function showEinkauf() {
  setTab('einkauf');
  document.getElementById('month-screen').classList.remove('open');
  document.getElementById('einkauf-screen').classList.add('open');
  if(ekListen.length===0) ekLadeAlles(); else ekRender();
}

async function woerniChecklistePruefen() {
  try {
    const jetzt = new Date();
    const stunde = jetzt.getHours();
    // Nur abends ab 17:00 Uhr prüfen
    if (stunde < 17) return;

    const tageszeiten = ['morgens','mittags','abends'];
    const offeneBereiche = [];

    Object.entries(BEREICHE).forEach(([bereichKey, bereich]) => {
      tageszeiten.forEach(tz => {
        const aufgaben = bereich.aufgaben[tz];
        if (!aufgaben || aufgaben.length === 0) return;
        const offen = aufgaben.filter((_, idx) => !checksHeute[`${bereichKey}-${tz}-${idx}`]);
        if (offen.length > 0) {
          offeneBereiche.push(`${bereich.name} (${tz}: ${offen.length} offen)`);
        }
      });
    });

    if (offeneBereiche.length === 0) return; // alles erledigt

    const SIGNAL_KEY = `checkliste-offen-${HEUTE_STR}`;
    const titel = `Checkliste heute nicht vollständig – ${offeneBereiche.length} Bereich(e) offen`;
    const naechster_schritt = `Checklisten-App öffnen und prüfen: ${offeneBereiche.slice(0,2).join(', ')}`;

    // Prüfen ob Aufgabe bereits existiert
    const check = await fetch(`${GHD_URL}/rest/v1/ghd_aufgaben?signal_key=eq.${SIGNAL_KEY}&status=neq.erledigt&select=id`, { headers: GHD_H });
    const existing = await check.json();

    if (Array.isArray(existing) && existing.length > 0) {
      await fetch(`${GHD_URL}/rest/v1/ghd_aufgaben?signal_key=eq.${SIGNAL_KEY}&status=neq.erledigt`, {
        method: 'PATCH', headers: GHD_H,
        body: JSON.stringify({ titel, naechster_schritt, geaendert_am: new Date().toISOString() })
      });
    } else {
      await fetch(`${GHD_URL}/rest/v1/ghd_aufgaben`, {
        method: 'POST', headers: GHD_H,
        body: JSON.stringify({
          typ: 'checkliste',
          titel,
          naechster_schritt,
          verantwortlich: 'mirjam',
          prioritaet: 'hoch',
          status: 'neu',

          signal_key: SIGNAL_KEY,

          erstellt_am: new Date().toISOString()
        })
      });
    }
  } catch(e) { console.warn('Wörni Checklisten-Signal fehlgeschlagen:', e); }
}
